name: Read the terms

# The sandbox cannot reach mapillary.com, and a decision about whether two
# hundred panoramas may be downloaded, adapted and re-hosted is not one to take
# from a search-result summary. So the pages are fetched here, in full, and
# printed to a log a person can read.
#
# Nothing is downloaded into the repository and nothing is committed. This is a
# reading room, not a pipeline.

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Comma-separated pages to read (blank = the licence set)'
        default: ''

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Which pages
        env:
          URLS: ${{ inputs.urls }}
        run: |
          set -uo pipefail
          cat > /tmp/urls.txt <<'EOF'
          https://www.mapillary.com/terms
          https://www.mapillary.com/developer/api-documentation
          https://help.mapillary.com/hc/en-us/articles/115001770409-CC-BY-SA-license-for-open-data
          EOF
          sed -i 's/^ *//' /tmp/urls.txt
          if [ -n "${URLS}" ]; then
            printf '%s' "${URLS}" | tr ',' '\n' | sed 's/^ *//; s/ *$//' > /tmp/urls.txt
          fi
          cat /tmp/urls.txt

      - name: Read
        run: |
          pip install --quiet playwright
          playwright install --with-deps chromium
          python tools/read_pages.py --file /tmp/urls.txt
