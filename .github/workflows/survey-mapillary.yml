name: Survey Mapillary 360s

# Commons holds heritage photographs, not heritage 360s. Mapillary is built for
# street-level imagery and is queried by bounding box, so relevance is
# geometric rather than textual -- the question becomes "is this image within
# 150 m of Petra", which is a fact about the image rather than a guess about a
# search engine.
#
# Needs the MAPILLARY_TOKEN secret: the access token beginning MLY|, not the
# client secret. Nothing is downloaded and nothing is committed.

on:
  workflow_dispatch:
    inputs:
      sample:
        description: 'How many sites to survey (spread across fame tiers)'
        default: '45'
      radius:
        description: 'Metres around each site'
        default: '150'
      resolution:
        description: 'Measure real pixel sizes instead of surveying coverage'
        default: 'false'

permissions:
  contents: read

jobs:
  survey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # A secret that arrives empty is the commonest way this fails, and
      # "not set" does not say which of the four usual causes it was. So each
      # likely place is probed by name and reported present or absent. A
      # missing secret reference is an empty string rather than an error, so
      # probing costs nothing. Only lengths and first characters are printed.
      - name: Where is the token
        env:
          A: ${{ secrets.MAPILLARY_TOKEN }}
          B: ${{ secrets.MAPILLARY_ACCESS_TOKEN }}
          C: ${{ secrets.MAPILLARY }}
          D: ${{ vars.MAPILLARY_TOKEN }}
          E: ${{ secrets.MAPILARY_TOKEN }}
          # The control. If the Sketchfab token added earlier is visible and
          # this one is not, the problem is this secret. If neither is visible,
          # the secrets are not reaching this repository at all -- most likely
          # they went to heritle-assets, which was created in the same sitting.
          S: ${{ secrets.SKETCHFAB_TOKEN }}
        run: |
          set -uo pipefail
          show () {
            if [ -n "${2:-}" ]; then
              echo "  FOUND  $1  (${#2} chars, starts '${2:0:4}')"
            else
              echo "  empty  $1"
            fi
          }
          echo "looking for the token:"
          show "secrets.MAPILLARY_TOKEN        " "${A:-}"
          show "secrets.MAPILLARY_ACCESS_TOKEN " "${B:-}"
          show "secrets.MAPILLARY              " "${C:-}"
          show "vars.MAPILLARY_TOKEN           " "${D:-}"
          show "secrets.MAPILARY_TOKEN (typo)  " "${E:-}"
          echo "  --- control ---"
          show "secrets.SKETCHFAB_TOKEN        " "${S:-}"
          if [ -z "${A:-}" ]; then
            echo
            echo "Nothing under secrets.MAPILLARY_TOKEN. The usual causes:"
            echo "  1. it went under the Variables tab, not Secrets"
            echo "  2. it went under Dependabot or Codespaces secrets, not Actions"
            echo "  3. the name differs (see which line above says FOUND)"
            echo "  4. it was added to a different repository -- note that"
            echo "     heritle-assets was created in the same sitting"
            echo
            if [ -n "${S:-}" ]; then
              echo "SKETCHFAB_TOKEN *is* visible here, so this repository's"
              echo "Actions secrets work and it is this one secret that is off."
            else
              echo "SKETCHFAB_TOKEN is not visible either, so no Actions secret"
              echo "is reaching this repository -- check which repo you were in."
            fi
            echo
            echo "The right place is:"
            echo "  Settings -> Secrets and variables -> Actions"
            echo "  -> Repository secrets -> New repository secret"
            echo "  Name: MAPILLARY_TOKEN   Value: the access token, begins MLY|"
            exit 1
          fi
          case "${A}" in
            MLY*) echo "shape looks like an access token" ;;
            *)    echo "warning: does not begin MLY|. If this is the client"
                  echo "secret, the survey will return nothing." ;;
          esac

      # A diagnostic must never block the work it is diagnosing. This step
      # has failed a run twice on its own choice of probe location while the
      # actual survey was fine.
      - name: What a response actually contains
        continue-on-error: true
        env:
          MAPILLARY_TOKEN: ${{ secrets.MAPILLARY_TOKEN }}
        run: python tools/survey_mapillary.py --schema || true

      - name: How big are the panoramas really
        if: ${{ inputs.resolution == 'true' }}
        env:
          MAPILLARY_TOKEN: ${{ secrets.MAPILLARY_TOKEN }}
        run: |
          pip install --quiet Pillow
          python tools/survey_mapillary.py --resolution

      - name: Survey
        if: ${{ inputs.resolution != 'true' }}
        env:
          MAPILLARY_TOKEN: ${{ secrets.MAPILLARY_TOKEN }}
          SAMPLE: ${{ inputs.sample }}
          RADIUS: ${{ inputs.radius }}
        run: |
          python tools/survey_mapillary.py \
            --sample "${SAMPLE:-45}" --radius "${RADIUS:-150}"
