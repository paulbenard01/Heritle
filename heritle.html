   The world at 440x220 makes anything smaller than a large country hard to
   read, which matters now that the map is the puzzle. The viewBox is the
   single source of truth for the view, so screen->world conversion (used by
   the bonus pin) stays correct at any zoom. */
let mapView = { x:0, y:0, w:MAP_W, h:MAP_H };
// Must match tools/build_land.py: the geometry is simplified to half a pixel
// at this zoom, so zooming past it shows the simplification rather than the
// coast. 10m Natural Earth supports forty.
const MAX_ZOOM = 40;

/* Keep the view inside the world and never wider than it. Separate from
   applyView because a gesture needs the clamped numbers to work out where the
   finger now points, several times, before anything is drawn. */
function clampView(){
  mapView.w = Math.min(MAP_W, Math.max(MAP_W / MAX_ZOOM, mapView.w));
  mapView.h = mapView.w * (MAP_H / MAP_W);
  mapView.x = Math.min(MAP_W - mapView.w, Math.max(0, mapView.x));
  mapView.y = Math.min(MAP_H - mapView.h, Math.max(0, mapView.y));
}

function applyView(){
  clampView();
  document.getElementById('mapSvg')
    .setAttribute('viewBox', `${mapView.x} ${mapView.y} ${mapView.w} ${mapView.h}`);
  scalePins();
}

/* A drag delivers several pointermove events per displayed frame, and each one
   used to redraw the map. One redraw per frame is all the screen can show. */
let viewPending = false;
function scheduleView(){
  if(viewPending) return;
  viewPending = true;
  requestAnimationFrame(()=>{ viewPending = false; applyView(); });
}

/* Pin radii are in world units, so counter-scale them to hold a constant
   on-screen size as the view zooms. Strokes handle themselves via
   vector-effect. Called on every view change *and* whenever a pin is added,
   because pins are added after buildMap has already applied the view. */
let pinScale = null;
function scalePins(force){
  const k = mapView.w / MAP_W;
  // Panning does not change the scale, so there is nothing to counter.
  if(!force && k === pinScale) return;
  pinScale = k;
  document.querySelectorAll('#pinLayer circle').forEach(c=>{
    c.setAttribute('r', c.dataset.r * k);
  });
  // The reveal's caption has to stay legible at every zoom, so it is counter-
  // scaled like the pins rather than growing with the map.
  document.querySelectorAll('#pinLayer text').forEach(el=>{
    el.setAttribute('font-size', el.dataset.fs * k);
    el.setAttribute('stroke-width', el.dataset.sw * k);
    el.setAttribute('y', Number(el.dataset.y) - Number(el.dataset.dy) * k);
  });
}

/* Screen point -> world coordinate, honouring the current zoom. */
function screenToWorld(clientX, clientY){
  const svg = document.getElementById('mapSvg');
  const rect = svg.getBoundingClientRect();
  return {
    x: mapView.x + ((clientX - rect.left) / rect.width) * mapView.w,
    y: mapView.y + ((clientY - rect.top) / rect.height) * mapView.h
  };
}

function zoomBy(factor, centreX, centreY){
  const cx = centreX === undefined ? mapView.x + mapView.w/2 : centreX;
  const cy = centreY === undefined ? mapView.y + mapView.h/2 : centreY;
  const newW = mapView.w / factor;
  // Keep the point under the cursor fixed while the view scales around it.
  mapView.x = cx - (cx - mapView.x) * (newW / mapView.w);
  mapView.y = cy - (cy - mapView.y) * (newW / mapView.w);
  mapView.w = newW;
  applyView();
}

function addPin(lat,lng,bucket,big){
  const p = project(lat,lng);
  const layer = document.getElementById('pinLayer');
  const r = big ? 7 : 5;
  const circle = document.createElementNS('http://www.w3.org/2000/svg','circle');
  circle.setAttribute('cx',p.x); circle.setAttribute('cy',p.y); circle.setAttribute('r',r);
  circle.dataset.r = r; circle.dataset.sw = 1.5;
  circle.setAttribute('fill', heatColorVar[bucket]); circle.setAttribute('stroke','var(--navy)');
  circle.setAttribute('stroke-width','1.5');
  circle.setAttribute('vector-effect','non-scaling-stroke');
  layer.appendChild(circle);
  scalePins(true);   // this one has never been scaled
}
/* Where the site actually was. A thin ring was easy to lose on a busy map at
   the one moment it matters most -- the end of a round nobody solved -- so it
   is now a filled gold point inside a halo, captioned. */
function addTargetPin(lat,lng,label){
  const p = project(lat,lng);
  const layer = document.getElementById('pinLayer');
  const ns = 'http://www.w3.org/2000/svg';
  const ring = document.createElementNS(ns,'circle');
  ring.setAttribute('cx',p.x); ring.setAttribute('cy',p.y); ring.setAttribute('r',10);
  ring.dataset.r = 10; ring.dataset.sw = 2;
  ring.setAttribute('fill','none'); ring.setAttribute('stroke','var(--gold)');
  ring.setAttribute('stroke-width','2');
  ring.setAttribute('vector-effect','non-scaling-stroke');
  ring.setAttribute('class','target-ring');
  layer.appendChild(ring);
  const dot = document.createElementNS(ns,'circle');
  dot.setAttribute('cx',p.x); dot.setAttribute('cy',p.y); dot.setAttribute('r',4);
  dot.dataset.r = 4; dot.dataset.sw = 1.5;
  dot.setAttribute('fill','var(--gold)'); dot.setAttribute('stroke','var(--navy)');
  dot.setAttribute('stroke-width','1.5');
  dot.setAttribute('vector-effect','non-scaling-stroke');
  layer.appendChild(dot);
  if(label) addMapCaption(p.x, p.y, label);
  scalePins(true);
}

/* A word on the map, counter-scaled so it neither grows with the zoom nor
   drifts off the pin it belongs to. */
function addMapCaption(px, py, label){
  const ns = 'http://www.w3.org/2000/svg';
  const p = { x: px, y: py };
  const layer = document.getElementById('pinLayer');
  {
    const txt = document.createElementNS(ns, 'text');
    // Near an edge the caption would be cut off by the sheet -- a site on the
    // Pacific coast read "he site is here". So it anchors away from whichever
    // edge it is close to, and drops below the pin at the top of the map.
    const anchor = p.x < 46 ? 'start' : (p.x > MAP_W - 46 ? 'end' : 'middle');
    // dy is subtracted, so a positive value lifts the caption clear of the
    // pin; near the top of the sheet it drops below it instead.
    const above = p.y > 20;
    txt.setAttribute('x',p.x); txt.setAttribute('y',p.y);
    txt.dataset.y = p.y; txt.dataset.dy = above ? 15 : -13; txt.dataset.fs = 9;
    txt.setAttribute('text-anchor',anchor);
    txt.setAttribute('fill','var(--gold)');
    txt.setAttribute('paint-order','stroke');
    txt.setAttribute('stroke','var(--navy)');
    // The halo that keeps the caption legible over a coastline is a stroke,
    // and a stroke in world units grows as the map is zoomed while the glyphs
    // are counter-scaled to stay the same size. Zoomed in it became a navy
    // slab wider than the words, sitting over the pin it was meant to point
    // at. It is counter-scaled like the font rather than left to
    // vector-effect, which is not reliable on text.
    txt.dataset.sw = 2;
    txt.setAttribute('stroke-width','2');
    txt.setAttribute('stroke-linejoin','round');
    txt.setAttribute('font-size',9);
    txt.setAttribute('font-weight','600');
    txt.textContent = label;
    layer.appendChild(txt);
  }
  scalePins(true);
}

/* A country that would also have been right. Thinner and unfilled, so it
   reads as "this one counted too" rather than as the site itself. */
function addAnswerRing(lat,lng){
  const p = project(lat,lng);
  const ring = document.createElementNS('http://www.w3.org/2000/svg','circle');
  // Small: twenty-five of these at world zoom is already a thicket over
  // Europe, and they are meant to be countable, not decorative.
  ring.setAttribute('cx',p.x); ring.setAttribute('cy',p.y); ring.setAttribute('r',4.5);
  ring.dataset.r = 4.5; ring.dataset.sw = 1;
  ring.setAttribute('fill','none'); ring.setAttribute('stroke','var(--gold)');
  ring.setAttribute('stroke-width','1');
  ring.setAttribute('stroke-dasharray','2.5 2');
  ring.setAttribute('opacity','0.8');
  ring.setAttribute('vector-effect','non-scaling-stroke');
  ring.setAttribute('class','answer-ring');
  document.getElementById('pinLayer').appendChild(ring);
  scalePins(true);
}

/* The gap the player never closed, drawn: nearest guess to the site. */
function addMissLine(fromLat, fromLng, toLat, toLng){
  const a = project(fromLat, fromLng), b = project(toLat, toLng);
  // Across the dateline the short way is off the edge of the sheet, which is
  // still truer than a line dragged back across the whole world.
  let ax = a.x;
  if(Math.abs(b.x - ax) > MAP_W/2) ax += (b.x > ax ? MAP_W : -MAP_W);
  const line = document.createElementNS('http://www.w3.org/2000/svg','line');
  line.setAttribute('x1',ax); line.setAttribute('y1',a.y);
  line.setAttribute('x2',b.x); line.setAttribute('y2',b.y);
  line.setAttribute('stroke','var(--gold)');
  line.setAttribute('stroke-width','1.2');
  line.setAttribute('stroke-dasharray','4 3');
  line.setAttribute('opacity','0.75');
  line.setAttribute('vector-effect','non-scaling-stroke');
  document.getElementById('pinLayer').appendChild(line);
}

/* ---------- Rendering ---------- */
function currentTarget(){ return targets[state.round]; }
function targetCountry(){
  const tg = currentTarget();
  if(!tg) return null;
  // Match the country record by name: the dataset keys by QID, the demo set
  // has no QIDs, and the name is what both agree on.
  return COUNTRIES.find(c => c.names.en === tg.country.en) || null;
}

/* Every country that counts as right. Usually one; for a tradition inscribed
   by a dozen states, a dozen -- marking eleven of them wrong would be a bug,
   not a hard round. */
function targetCountries(){
  const tg = currentTarget();
  if(!tg) return [];
  const names = (tg.countryNames && tg.countryNames.length)
              ? tg.countryNames.map(n => n.en)
              : [tg.country.en];
  const found = COUNTRIES.filter(c => names.includes(c.names.en));
  return found.length ? found : [targetCountry()].filter(Boolean);
}

/* How far a dropped pin is from the answer. The site's own coordinates, and
   for an element inscribed by several countries, whichever of them is nearest
   as well -- a tradition shared from Morocco to Iraq is not "wrong" because
   the pin landed on the far side of it. */
/* The point the distance is actually measured to: the site itself, or -- for
   an element inscribed by several states -- whichever of their centres the pin
   came closest to. Falconry is held by twenty-five countries and is no more
   "in" one of them than another, so the nearest is the only honest reading.

   Everything that points somewhere uses this one answer: the kilometres, the
   compass bearing and the line drawn at the end of a lost round. Measuring to
   the nearest country while pointing at the stored coordinate would have the
   game say 1,200 km north-east and then draw a line six thousand the other
   way. */
function nearestAnswerPoint(lat, lng){
  const tg = currentTarget();
  if(!tg) return null;
  let best = { lat: tg.lat, lng: tg.lng, km: haversineKm(lat, lng, tg.lat, tg.lng) };
  const answers = targetCountries();
  if(answers.length > 1){
    answers.forEach(a => {
      const km = haversineKm(lat, lng, a.lat, a.lng);
      if(km < best.km) best = { lat: a.lat, lng: a.lng, km };
    });
  }
  return best;
}

function pointDistanceKm(lat, lng){
  const aim = nearestAnswerPoint(lat, lng);
  return aim ? aim.km : 0;
}
function currentGuesses(){ return state.guesses[state.round]; }
function roundFinished(){ return state.roundStatus[state.round] !== null; }

function render(){
  const T = t();
  document.getElementById('pitch').textContent = T.pitch;
  renderLinks();
  renderFooterDocs();
  document.getElementById('tagline').textContent = T.tagline;
  renderTapHint();

  // rounds row
  const rr = document.getElementById('roundsRow'); rr.innerHTML = '';
  for(let i=0;i<N_ROUNDS;i++){
    const pip = document.createElement('div');
    let cls = 'round-pip';
    if(roundPlan(i).bonus) cls += ' bonus';
    if(state.roundStatus[i] === 'solved') cls += ' done-solved';
    else if(state.roundStatus[i] === 'failed') cls += ' done-failed';
    else if(i === state.round) cls += ' current';
    pip.className = cls;
    // The bonus round is marked rather than numbered: it is not a fourth site.
    pip.textContent = roundPlan(i).bonus ? '\u2605' : i+1;
    rr.appendChild(pip);
  }

  if(state.round >= N_ROUNDS){ renderFinal(); return; }

  const target = currentTarget();
  document.querySelector('.meta-row').style.display = '';   // renderFinal hides it
  document.getElementById('modeBadge').textContent = target.type==='material' ? T.modeMaterial : T.modeImmaterial;
  document.getElementById('scoreBadge').textContent = `\u03a3 ${T.scoreOf(totalScore(), MAX_SCORE)}`;
  const counter = document.getElementById('guessCounter');
  counter.textContent = T.guessCount(currentGuesses().length, guessesAllowed(state.round));
  if(guessesAllowed(state.round) > 1 && !roundFinished()){
    const note = document.createElement('div');
    note.className = 'counter-note';
    note.textContent = T.lastCounts;
    counter.appendChild(note);
  }

  // photo
  const img = document.getElementById('siteImg'), fb = document.getElementById('photoFallback');
  img.style.display = ''; fb.style.display = 'none';
  const box = document.getElementById('photoBox');
  box.classList.remove('zoomable');
  // Handlers must be attached before src: a cached image fires load immediately
  // on assignment, and a handler set afterwards would never run.
  img.onload = ()=> box.classList.add('zoomable');
  img.onerror = ()=>{
    img.style.display='none'; fb.style.display='flex';
    box.classList.remove('zoomable');
    document.getElementById('fallbackText').textContent = T.photoFallback;
  };
  // A downloaded copy wins when the pipeline made one; otherwise the photo
  // comes straight from Commons' CDN at full width. Either way a miss falls
  // through to onerror and the placeholder.
  const shot = currentPhoto(target);
  img.src = (shot && (shot.path || shot.url))
            || `images/${target.id}.jpg`;
  img.alt = roundFinished() ? target.names[lang] : '';
  // Re-render with the same src doesn't refire load; catch the already-decoded case.
  if(img.complete && img.naturalWidth) box.classList.add('zoomable');
  // Held back until the round is over. A photographer's name or a licence
  // template routinely carries a country in it, which hands the player the
  // answer from the corner of the picture.
  document.getElementById('photoCredit').textContent =
    (shot && roundFinished()) ? [shot.credit, shot.license].filter(Boolean).join(' · ') : '';
  renderPhotoCount(target);

  renderClues(target); renderHistory(); renderMapForRound(); renderRoundResult();
  document.getElementById('finalResult').hidden = true;
}

/* ---------- Photographs ----------
   One photo was a coin toss. Plenty of inscriptions have a single image on
   Wikidata that says almost nothing about the place -- a plaque, a doorway, a
   museum case -- and a round built on one of those is unguessable rather than
   hard. Each wrong guess reveals another, so a weak opening photo costs a
   guess instead of the round. */
function photosOf(target){
  return (target && target.photos && target.photos.length) ? target.photos
       : (target && target.image ? [target.image] : []);
}
/* How many photographs the player has earned: one to start, one more per
   guess made, capped at what the entry has. */
function unlockedCount(target){
  const n = photosOf(target).length;
  return n ? Math.min(currentGuesses().length + 1, n) : 0;
}

/* Which of them is on screen. Defaults to the newest, because the point of
   unlocking one is to see it, but the player can page back through the ones
   they have already earned -- an earlier shot is often the more useful clue,
   and having it vanish behind the next guess was a waste of it. */
let photoView = [0, 0, 0, 0];
function photoIndexFor(target){
  const unlocked = unlockedCount(target);
  if(!unlocked) return 0;
  return Math.min(photoView[state.round] || 0, unlocked - 1);
}
function currentPhoto(target){
  const ps = photosOf(target);
  return ps.length ? ps[photoIndexFor(target)] : null;
}
function showNewestPhoto(){
  const tg = currentTarget();
  photoView[state.round] = Math.max(0, unlockedCount(tg) - 1);
}
function stepPhoto(by){
  const tg = currentTarget();
  const unlocked = unlockedCount(tg);
  photoView[state.round] =
    Math.max(0, Math.min(photoIndexFor(tg) + by, unlocked - 1));
  render();
}

function renderPhotoCount(target){
  const nav = document.getElementById('photoNav');
  const el = document.getElementById('photoCount');
  if(!nav || !el) return;
  const prev = document.getElementById('photoPrev');
  const next = document.getElementById('photoNext');
  const unlocked = unlockedCount(target);
  if(unlocked < 2){
    nav.hidden = true;
    if(prev) prev.hidden = true;
    if(next) next.hidden = true;
    return;
  }
  nav.hidden = false;
  const i = photoIndexFor(target);
  el.textContent = t().photoOf(i + 1, unlocked);
  // Gold only while looking at the one the last guess just earned.
  el.classList.toggle('fresh', i === unlocked - 1 && currentGuesses().length > 0);
  if(prev){ prev.hidden = false; prev.disabled = i <= 0; }
  if(next){ next.hidden = false; next.disabled = i >= unlocked - 1; }
}

function renderClues(target){
  // Between rounds the pending pin has to go, or the confirm bar would still
  // be offering the previous round's guess.
  if(roundFinished()) clearPending(); else renderTapHint();

  const T = t();
  const keys = ['continent','category','year','region','clue'];
  const box = document.getElementById('clues'); box.innerHTML = '';
  keys.forEach((key,i)=>{
    const unlocked = currentGuesses().length > i || roundFinished();
    const div = document.createElement('div');
    div.className = 'clue' + (key==='clue' ? ' full' : '') + (unlocked ? ' unlocked' : ' locked');
    let value = '···';
    if(unlocked){
      if(key==='continent') value = target.continent[lang];
      else if(key==='category') value = target.category[lang];
      else if(key==='year') value = target.year ? `${Math.floor(target.year/10)*10}s` : '—';
      else if(key==='region') value = regionOf(target);
      else if(key==='clue') value = (target.clue && target.clue[lang]) || '—';
    }
    div.innerHTML = `<span class="label">${T.clueLabels[i]}</span>${value}`;
    box.appendChild(div);
  });
}

/* What a guess is called in the list: the country it was placed in, named in
   the language being read now, or "open water". Old saves recorded only a
   country id, so that is still honoured. */
function guessName(g){
  if(g.names) return g.names[lang] || g.names.en;
  const e = COUNTRIES.find(c => c.id === g.id);
  return e ? (e.names[lang] || e.names.en) : t().openWater;
}

function renderHistory(){
  const T = t();
  const box = document.getElementById('history'); box.innerHTML = '';
  [...currentGuesses()].reverse().forEach(g=>{
    const row = document.createElement('div'); row.className = 'hist-row';
    const tag = (ok, label) =>
      `<span class="hist-tag ${ok ? 'ok' : 'no'}">${ok ? '✓' : '✗'} ${label}</span>`;
    const tags = g.contOk === undefined ? '' :
      `<span class="hist-tags">${tag(g.bucket === 'correct', T.spotLabel)}`
      + `${tag(g.contOk, T.clueLabels[0])}${tag(g.regionOk, T.clueLabels[3])}</span>`;
    // km before the tags: the tags claim a full row, so anything after them
    // wraps onto a third line.
    row.innerHTML = `<span class="hist-dot" data-glyph="${heatGlyph[g.bucket]||''}" style="background:${heatColorVar[g.bucket]}"></span>
      <span class="hist-name">${guessName(g)}</span>
      <span class="hist-km">${g.km} km ${dirLabel(g.bearing)}</span>${tags}`;
    box.appendChild(row);
  });
}

function renderMapForRound(){
  buildMap();
  currentGuesses().forEach((g,i)=>{
    // The pin stands where the player put it. A guess saved before free
    // placement carries no coordinates, so it falls back to its country.
    const at = typeof g.lat === 'number' ? g : COUNTRIES.find(c=>c.id===g.id);
    if(at) addPin(at.lat, at.lng, g.bucket, i===currentGuesses().length-1);
  });
  // The provisional pin: where the last tap landed, before it is committed.
  if(pendingGuess && !roundFinished()){
    addPin(pendingGuess.lat, pendingGuess.lng, 'pending', true);
  }
  // Nothing to spoil any more: the round is scored by the guesses themselves,
  // so the site is marked as soon as the round is over.
  if(roundFinished()){
    const tg = currentTarget();
    // Four guesses spent and still no idea where it was is the worst way to
    // leave a round. So the site is not merely pinned: it is marked, named,
    // and joined by a line to the nearest guess, which turns "wrong" into a
    // distance you can see.
    const gs = currentGuesses();
    const near = gs.reduce((b, g) => {
      const at = typeof g.lat === 'number' ? g : COUNTRIES.find(c=>c.id===g.id);
      if(!at) return b;
      return (!b || g.km < b.km) ? { lat: at.lat, lng: at.lng, km: g.km } : b;
    }, null);
    // An element inscribed by several states has no single answer to reveal.
    // Marking one of them and calling it "the site" would teach the wrong
    // thing about the very entries where the answer is most interesting:
    // falconry is held by twenty-five countries, Nowruz by thirteen. So every
    // country that would have counted is ringed, and the caption says how many
    // there were rather than claiming a place.
    const answers = targetCountries();
    const several = answers.length > 1;
    if(near && state.roundStatus[state.round] !== 'solved'){
      // To the point the kilometres were measured to, not to the stored
      // coordinate: on a multinational element those are different places.
      const aim = nearestAnswerPoint(near.lat, near.lng);
      addMissLine(near.lat, near.lng, aim.lat, aim.lng);
    }
    if(several){
      // Every one of them equally, and no filled point singling one out: the
      // stored coordinate of a tradition is just whichever country the
      // pipeline listed first, and drawing it as "the site" would invent a
      // home for something that does not have one.
      answers.forEach(a => addAnswerRing(a.lat, a.lng));
      // Over the northernmost of them, so the caption clears the cluster
      // instead of landing in the middle of it -- the stored coordinate is
      // usually somewhere in the thick of it.
      const top = answers.reduce((b, a) => (!b || a.lat > b.lat) ? a : b, null);
      const p = project(top.lat, top.lng);
      addMapCaption(p.x, p.y, t().inscribedBy(answers.length));
    } else {
      addTargetPin(tg.lat, tg.lng, t().siteHere);
    }
  }
  const T = t();
  const readout = document.getElementById('mapReadout');
  const gs = currentGuesses();
  if(!gs.length){
    readout.className = 'map-readout';
    readout.style.removeProperty('--lg-accent');
    // What the bonus round is worth, and that it has three tries: said
    // before the first guess, because afterwards it is no use.
    readout.textContent = roundPlan(state.round).bonus ? T.bonusIntro : T.readoutStart;
  } else {
    // Same verdict the history row carries, restated where it cannot be
    // missed: whether the country was right at all, which country, how far
    // off, and whether the continent and region were right.
    //
    // A wrong-but-neighbouring guess used to show two ticks and a small
    // distance, which reads as success: the first player through the game
    // thought she had solved it and that the game had stopped working. So the
    // verdict now says so in words, the country gets a mark of its own next to
    // the continent and region, and the tries are drawn as boxes that fill in
    // -- there is no way to mistake a near miss for an answer.
    const last = gs[gs.length-1];
    const right = last.bucket === 'correct';
    const allowed = guessesAllowed(state.round);
    const left = Math.max(0, allowed - gs.length);
    const tag = (ok, label) =>
      `<span class="hist-tag ${ok ? 'ok' : 'no'}">${ok ? '\u2713' : '\u2717'} ${label}</span>`;
    const tags = last.contOk === undefined ? '' :
      `<span class="hist-tags">${tag(right, T.spotLabel)}`
      + `${tag(last.contOk, T.clueLabels[0])}${tag(last.regionOk, T.clueLabels[3])}</span>`;
    const pips = Array.from({ length: allowed }, (_, i) =>
      `<span class="lg-pip ${i < gs.length ? (right && i === gs.length-1 ? 'hit' : 'used') : 'free'}"
             aria-hidden="true">${i < gs.length ? (right && i === gs.length-1 ? '\u2713' : '\u2717') : ''}</span>`
    ).join('');
    // Won by proximity rather than by country, the player has to be told so:
    // "right country" over a pin in the wrong one would read as a bug.
    const verdict = right
      ? `<span class="lg-verdict ok"><b>\u2713 ${last.via === 'near'
           ? T.nearEnough(last.km) : T.rightCountry}</b></span>`
      : `<span class="lg-verdict no"><b>\u2717 ${T.wrongCountry}</b>`
        + `${left > 0 ? ` \u2014 ${T.tryAgain}` : ''}</span>`;
    readout.className = 'map-readout last-guess' + (right ? ' solved' : '');
    readout.style.setProperty('--lg-accent', heatColorVar[last.bucket]);
    readout.innerHTML =
      `${verdict}
       <span class="lg-head">
         <span class="hist-dot" data-glyph="${heatGlyph[last.bucket]||''}" style="background:${heatColorVar[last.bucket]}"></span>
         <b>${guessName(last)}</b>
       </span>
       ${right ? '' : `<span class="lg-dist">${T.readout(last.km, dirLabel(last.bearing))}</span>`}
       ${tags}
       <span class="lg-tries">
         <span class="lg-pips">${pips}</span>
         <span>${T.guessOf(gs.length, allowed)}${(!right && left > 0) ? ` \u00b7 ${T.triesLeft(left)}` : ''}</span>
       </span>`;
  }
}

function totalScore(){ return Math.round(state.roundScore.reduce((a,b)=>a+b,0)); }

function renderRoundResult(){
  const box = document.getElementById('roundResult');
  const T = t(); const target = currentTarget();
  if(!roundFinished()){ box.hidden = true; return; }
  box.hidden = false;
  const solved = state.roundStatus[state.round] === 'solved';
  const grid = currentGuesses().map(g=>heatEmoji[g.bucket]).join(' ');
  const pts = Math.round(state.roundScore[state.round]);
  const max = Math.round(roundPlan(state.round).points);
  // The site name is the reward, not the puzzle: it is revealed either way,
  // alongside the country that was the actual answer.
  const several = !!(target.countryNames && target.countryNames.length > 1);
  const answerNames = several
    ? target.countryNames.map(n => n[lang] || n.en).join(' \u00b7 ')
    : target.country[lang];
  const reveal = `<p>${several ? T.countriesWere : T.answerWas} <b>${answerNames}</b><br>
                  <span style="color:var(--cream)">${target.names[lang]}</span></p>`;
  // A missed round still scores, so the points line is the real outcome --
  // "Round over" alone used to read as zero. It names the guess that actually
  // scored, which is the closest one of the round rather than the last.
  const best = currentGuesses().reduce(
    (b, g) => (b && closeness(b) >= closeness(g) ? b : g), null);
  const bestLabel = best ? guessName(best) : '';
  const pointsBlock = solved
    ? `<p class="pts">${T.pointsSolved(pts, max, currentGuesses().length)}</p>`
    : `<p class="pts">${T.pointsPartial(pts, max, bestLabel, best ? best.km : 0)}</p>`;
  box.innerHTML = `
    <span class="tier-badge">${roundPlan(state.round).bonus ? T.bonusBadge : T.tier[target.tier]}</span>
    <h2>${solved ? T.win : T.lose}</h2>
    <p>${solved ? T.winSub(currentGuesses().length) : ''}</p>
    ${reveal}
    <div class="share-grid">${grid}</div>
    ${pointsBlock}
    <button class="btn" id="nextBtn">${state.round + 1 >= N_ROUNDS ? T.seeResult : T.nextRound}</button>
    <button class="btn secondary" id="learnBtn">${T.learnMore}</button>`;
  document.getElementById('nextBtn').onclick = ()=>{
    state.round++; photoView[state.round] = 0; saveState(); render();
  };
  document.getElementById('learnBtn').onclick = ()=> openInfoModal(target);
  clearPending();
  // The round is over and the verdict sits below the map; on a phone that is
  // off-screen, so the round appeared to end with nothing happening.
  // Keyed to the round: the element is reused, so a plain flag would scroll
  // once and never again for rounds 2 and 3.
  if(box.dataset.shown !== String(state.round)){
    box.dataset.shown = String(state.round);
    box.scrollIntoView({ behavior:'smooth', block:'center' });
  }
}

/* SVG path data for a set of flat [x,y,x,y,...] rings. */
function ringsToPath(rings){
  const out = [];
  for(const r of rings){
    if(r.length < 6) continue;
    let d = 'M' + r[0] + ',' + r[1];
    for(let i = 2; i < r.length; i += 2) d += 'L' + r[i] + ',' + r[i+1];
    out.push(d + 'Z');
  }
  return out.join('');
}

/* ---------- Resolving a tap to a country ----------
   The guess is a point on the map, so a tap has to say which country it landed
   in. Ray casting over that country's rings, even-odd, so a point inside a
   hole (an enclave cut out of the surrounding country) counts as outside.
   Bounding boxes first, because testing 200 countries vertex by vertex on
   every tap is work that is almost entirely wasted. */
function buildShapeIndex(){
  SHAPE_BOX = null;
  if(!LAND_SHAPES) return;
  SHAPE_BOX = {};
  for(const iso in LAND_SHAPES){
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for(const r of LAND_SHAPES[iso]){
      for(let i = 0; i < r.length; i += 2){
        if(r[i]   < x0) x0 = r[i];
        if(r[i]   > x1) x1 = r[i];
        if(r[i+1] < y0) y0 = r[i+1];
        if(r[i+1] > y1) y1 = r[i+1];
      }
    }
    SHAPE_BOX[iso] = [x0, y0, x1, y1];
  }
}

function pointInShape(rings, x, y){
  let inside = false;
  for(const r of rings){
    const n = r.length / 2;
    for(let k = 0, l = n - 1; k < n; l = k++){
      const xi = r[2*k], yi = r[2*k+1], xj = r[2*l], yj = r[2*l+1];
      if(((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)){
        inside = !inside;
      }
    }
  }
  return inside;
}

/* ISO of the country under a world-space point, or null for open water. */
function isoAt(x, y){
  if(!LAND_SHAPES || !SHAPE_BOX) return null;
  for(const iso in LAND_SHAPES){
    const b = SHAPE_BOX[iso];
    if(x < b[0] || x > b[2] || y < b[1] || y > b[3]) continue;
    if(pointInShape(LAND_SHAPES[iso], x, y)) return iso;
  }
  return null;
}

/* A country too small to have a polygon at this resolution -- Vatican City is
   400m across -- would otherwise be impossible to guess even though it holds
   inscriptions. Fall back to the nearest centroid within about ten screen
   pixels, which is tight enough that it never hijacks a tap on open sea. */
const SNAP_PX = 10;
function countryNear(x, y){
  const perPx = mapView.w / (document.getElementById('mapSvg').getBoundingClientRect().width || 1);
  const limit = SNAP_PX * perPx;
  let best = null, bestD = Infinity;
  for(const c of COUNTRIES){
    const p = project(c.lat, c.lng);
    const d = Math.hypot(p.x - x, p.y - y);
    if(d < bestD){ bestD = d; best = c; }
  }
  return bestD <= limit ? best : null;
}

/* The guessable country carrying that ISO code, if the dataset knows it. */
function countryByIso(iso){
  if(!iso) return null;
  return COUNTRIES.find(c => c.iso === iso) || null;
}

/* The pin-drop bonus that used to live here is gone. It asked the player to
   place the exact spot after the round had already revealed it, and scoring is
   distance-based now, so precision is measured by the guess itself. */

/* Pan by dragging, zoom by wheel or pinch. panMoved distinguishes a drag from
   a tap, so a drag is never mistaken for a click on the map. */
let panMoved = false;
(function setupMapGestures(){
  const svg = document.getElementById('mapSvg');
  const pointers = new Map();
  let last = null, pinchStart = 0, startW = 0;
  // Measured once per gesture. getBoundingClientRect forces the browser to
  // settle layout, and calling it on every pointermove of a drag was paying
  // that cost dozens of times for a number that cannot change mid-drag.
  let rect = null;
  const svgRect = ()=> (rect || (rect = svg.getBoundingClientRect()));

  svg.addEventListener('pointerdown', e=>{
    pointers.set(e.pointerId, e);
    panMoved = false;
    rect = null;
    if(pointers.size === 1){ last = { x:e.clientX, y:e.clientY }; }
    if(pointers.size === 2){
      const [a,b] = [...pointers.values()];
      pinchStart = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
      startW = mapView.w;
    }
    svg.setPointerCapture(e.pointerId);
  });

  svg.addEventListener('pointermove', e=>{
    if(!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, e);
    if(pointers.size === 2 && pinchStart){
      const [a,b] = [...pointers.values()];
      const dist = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
      if(dist > 0){
        // Worked out entirely in numbers, then drawn once: the midpoint has to
        // stay under the fingers, which needs the clamped view, not a redraw.
        const mx = (a.clientX+b.clientX)/2, my = (a.clientY+b.clientY)/2;
        const before = screenToWorld(mx, my);
        mapView.w = startW * (pinchStart / dist);
        clampView();
        const after = screenToWorld(mx, my);
        mapView.x += before.x - after.x; mapView.y += before.y - after.y;
        scheduleView();
        panMoved = true;
      }
      return;
    }
    if(pointers.size === 1 && last){
      const r = svgRect();
      const dx = (e.clientX - last.x) / r.width * mapView.w;
      const dy = (e.clientY - last.y) / r.height * mapView.h;
      if(Math.abs(e.clientX-last.x) + Math.abs(e.clientY-last.y) > 3) panMoved = true;
      // Only pan once zoomed in; at full extent there is nowhere to go.
      if(mapView.w < MAP_W){
        mapView.x -= dx; mapView.y -= dy; clampView(); scheduleView();
      }
      last = { x:e.clientX, y:e.clientY };
    }
  });

  const release = e=>{
    pointers.delete(e.pointerId);
    if(pointers.size < 2) pinchStart = 0;
    if(pointers.size === 0){ last = null; rect = null; applyView(); }
  };
  svg.addEventListener('pointerup', release);
  svg.addEventListener('pointercancel', release);

  svg.addEventListener('wheel', e=>{
    e.preventDefault();
    const w = screenToWorld(e.clientX, e.clientY);
    zoomBy(e.deltaY < 0 ? 1.25 : 1/1.25, w.x, w.y);
  }, { passive:false });

  document.getElementById('zoomIn').onclick  = ()=> zoomBy(1.6);
  document.getElementById('zoomOut').onclick = ()=> zoomBy(1/1.6);
  document.getElementById('zoomReset').onclick = ()=>{
    mapView = { x:0, y:0, w:MAP_W, h:MAP_H }; applyView();
  };
})();

/* ---------- Info modal ---------- */
/* Where to go to actually learn about the thing.

   No video is embedded and none is chosen for you. Picking one automatically
   would mean a blind search over two thousand mostly obscure subjects, and a
   confidently wrong video is worse than none -- so the video link opens a
   search and you choose. The official listing is the better bet anyway: those
   pages carry the nomination films and documents.

   Everything here is built from fields the entry already has, so a link is
   offered only when it will actually resolve. */
function learnLinks(entry){
  const T = t();
  const out = [];
  // Every row has the same shape: a mark, the label, and the sign that it
  // leaves the game. Reading down them should feel like a list, not a jumble.
  const a = (href, mark, label) =>
    `<a class="learn-link" href="${href}" target="_blank" rel="noopener noreferrer">
       <span class="ll-mark" aria-hidden="true">${mark}</span>
       <span class="ll-text">${label}</span>
       <span class="ll-go" aria-hidden="true">↗</span></a>`;

  // One place to read about it. The official listing where the entry has one;
  // otherwise the encyclopaedia, but only for entries whose article title the
  // build checked against the API -- the titles come from Wikidata's sitelinks
  // and a share of them no longer resolve, and a link that lands on nothing is
  // worse than one that was never offered.
  const w = entry.wiki || {};
  const wlang = w[lang] ? lang : (w.en ? 'en' : (w.fr ? 'fr' : (w.es ? 'es' : null)));
  if(entry.siteId){
    out.push(a(`https://whc.unesco.org/en/list/${encodeURIComponent(entry.siteId)}`,
               '§', T.linkOfficial));
  } else if(entry.officialUrl){
    out.push(a(entry.officialUrl, '§', T.linkOfficial));
  } else if(wlang){
    out.push(a(`https://${wlang}.wikipedia.org/wiki/${encodeURIComponent(w[wlang])}`,
               'W', T.linkWiki));
  }

  // Last, and named after the thing itself: "videos about X" says what you get,
  // where "find videos" said only what the button does.
  const name = (entry.names && (entry.names[lang] || entry.names.en)) || '';
  const country = entry.country
    ? (typeof entry.country === 'string' ? entry.country
       : (entry.country.en || entry.country[lang] || '')) : '';
  const q = encodeURIComponent(((entry.names && entry.names.en) || name) + ' ' + country);
  out.push(a(`https://www.youtube.com/results?search_query=${q}`, '▶', T.linkVideo(name)));
  return out;
}

function openInfoModal(entry, rec){
  const T = t();
  // country and category are {en,fr,es} on a live entry, but an old catalogue
  // record may carry a plain string.
  const pick = v => !v ? '' : (typeof v === 'string' ? v : (v[lang] || v.en || ''));
  const names = entry.names || {};
  document.getElementById('modalTitle').textContent =
    names[lang] || names.en || entry.id;
  document.getElementById('modalSub').textContent =
    [pick(entry.country), pick(entry.category), entry.year].filter(Boolean).join(' · ');
  document.getElementById('modalDesc').textContent = (entry.clue && entry.clue[lang]) || '';
  // Every photograph the entry has, not the one the round happened to stop on.
  // By the time a card can be opened the answer is known, so there is nothing
  // left to protect -- and the credits are owed in full.
  galleryShots = photosOf(entry);
  if(!galleryShots.length && rec && rec.image) galleryShots = [rec.image];
  galleryAt = 0;
  renderGallery();
  document.getElementById('modalVideoLabel').textContent = T.learnLabel;
  document.getElementById('modalLinks').innerHTML = learnLinks(entry).join('');
  document.getElementById('modalClose').textContent = T.close;
  // Favouriting is offered wherever the entry is -- including the day it was
  // met, which is the moment a player actually wants to keep it.
  const star = document.getElementById('modalFav');
  const id = (rec && rec.id) || entry.id;
  const known = !!profile.collection[id];
  star.hidden = !known;
  if(known){
    const on = isFavourite(id);
    star.textContent = (on ? '★ ' : '☆ ') + (on ? T.favRemove : T.favAdd);
    star.classList.toggle('on', on);
    star.onclick = ()=>{
      toggleFavourite(id);
      openInfoModal(entry, rec);
      if(document.getElementById('viewCollection').offsetParent) renderCollection();
    };
  }
  document.getElementById('modalBackdrop').classList.add('open');
}
/* ---------- The entry's photographs ---------- */
let galleryShots = [], galleryAt = 0;
function renderGallery(){
  const T = t();
  const fig = document.getElementById('gal');
  const img = document.getElementById('galImg');
  const credit = document.getElementById('galCredit');
  const n = galleryShots.length;
  fig.hidden = !n;
  if(!n){ credit.textContent = ''; return; }
  galleryAt = Math.max(0, Math.min(galleryAt, n - 1));
  const shot = galleryShots[galleryAt];
  img.src = shot.path || shot.url || '';
  img.alt = T.galOf(galleryAt + 1, n);
  credit.textContent = [shot.credit, shot.license].filter(Boolean).join(' · ');
  // One arrow and one dot per photograph only when there is more than one:
  // a single-photograph entry should not look like it is missing some.
  const many = n > 1;
  document.getElementById('galPrev').hidden = !many;
  document.getElementById('galNext').hidden = !many;
  document.getElementById('galPrev').disabled = galleryAt === 0;
  document.getElementById('galNext').disabled = galleryAt === n - 1;
  document.getElementById('galDots').innerHTML = many
    ? galleryShots.map((_, i) => `<i class="${i === galleryAt ? 'on' : ''}"></i>`).join('')
    : '';
}
function stepGallery(by){ galleryAt += by; renderGallery(); }
document.getElementById('galPrev').addEventListener('click', ()=> stepGallery(-1));
document.getElementById('galNext').addEventListener('click', ()=> stepGallery(1));

/* Swipe, because on a phone reaching for a small arrow is not what a hand
   expects to do with a photograph. Passive listeners, and only a mostly
   sideways movement counts, so scrolling the page still works normally.

   `moved` is what stops a swipe also counting as a tap: the photograph on the
   board opens the lightbox when tapped, and a thumb that travelled 90px across
   it was paging, not asking to zoom in. */
function onSwipe(el, step){
  if(!el) return;
  let x0 = null, y0 = null;
  el.addEventListener('touchstart', e=>{
    const t = e.changedTouches[0];
    x0 = t.clientX; y0 = t.clientY;
    el.dataset.moved = '';
  }, { passive:true });
  el.addEventListener('touchend', e=>{
    if(x0 === null) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - x0, dy = t.clientY - y0;
    x0 = null;
    if(Math.abs(dx) > 38 && Math.abs(dx) > Math.abs(dy) * 1.5){
      el.dataset.moved = '1';
      step(dx < 0 ? 1 : -1);
    }
  }, { passive:true });
}
onSwipe(document.getElementById('gal'), stepGallery);
document.addEventListener('keydown', e=>{
  if(!document.getElementById('modalBackdrop').classList.contains('open')) return;
  if(e.key === 'ArrowLeft') stepGallery(-1);
  else if(e.key === 'ArrowRight') stepGallery(1);
  else if(e.key === 'Escape') document.getElementById('modalBackdrop').classList.remove('open');
});
/* ---------- The mark: a menu, and a spinning top ----------

   A quick tap opens the menu. Holding winds the little person up like a top --
   faster the longer you hold -- and letting go lets him coast down under
   friction and stop wherever his momentum leaves him, which is the whole point
   of a top and the reason this is not a CSS animation: there is no fixed
   duration and no tidy final angle.

   Holding is not a tap, so a long press does not also toggle the menu. */
const SPIN = {
  windUp:   1200,   // deg/s^2 while held
  topSpeed: 4320,   // deg/s -- twelve turns a second, a proper blur
  drag:     1.1,    // proportional slowdown, s^-1
  friction: 200,    // deg/s^2 -- constant, so it actually stops
  stopBelow: 26,    // deg/s, under which it is at rest
  tapMs:    260     // longer than this is a hold, not a tap
};
const DIZZY_TURNS = 100;

/* The header mark opens the menu and does nothing else. The spinning belongs
   to the little person, and he has moved: he sits inside the menu now, beside
   Who am I, which is the one row that is about a person. Same physics, same
   hundred turns, same secret. */
(function markMenu(){
  const mark = document.getElementById('mark');
  const menu = document.getElementById('markMenu');
  if(!mark || !menu) return;
  const dim = document.getElementById('markDim');

  const setOpen = (open)=>{
    // An empty menu is not worth opening: with nothing configured there is
    // nothing in it, and a blank panel reads as a bug.
    const has = menu.children.length > 0;
    menu.hidden = !(open && has);
    if(dim) dim.hidden = menu.hidden;   // the page goes quiet behind it
    mark.setAttribute('aria-expanded', String(!menu.hidden));
  };

  mark.addEventListener('click', (e)=>{
    e.stopPropagation();
    setOpen(menu.hidden);
  });
  // Anywhere else, or Escape, closes it -- including a tap on the board, which
  // is what a hand reaches for when it wants the menu gone.
  document.addEventListener('click', (e)=>{
    if(!menu.hidden && !menu.contains(e.target) && !mark.contains(e.target)) setOpen(false);
  });
  document.addEventListener('keydown', (e)=>{
    if(e.key === 'Escape' && !menu.hidden){ setOpen(false); mark.focus(); }
  });
})();

/* Wind him up. Holding accelerates at a constant rate to a cap; letting go
   hands him to drag plus friction, so he coasts down and stops wherever his
   momentum leaves him. There is no fixed duration and no tidy final angle,
   which is the whole point of a top and the reason this is not a keyframe.

   Attached to whatever element is given, because he has moved once already
   and may move again. */
function spinTop(host, img){
  if(!host || !img) return;
  const calm = matchMedia('(prefers-reduced-motion: reduce)');
  let angle = 0, vel = 0, held = false, raf = null, last = 0;
  let turnedThisSpin = 0;             // degrees since the top started moving
  let pressedAt = 0;
  // The count, shown once he is properly going. Created here rather than in
  // the markup because he has moved twice already and takes his parts with him.
  const readout = document.createElement('span');
  readout.className = 'spin-turns';
  readout.setAttribute('aria-hidden', 'true');
  host.appendChild(readout);
  const SHOW_FROM = 8;                // turns, before which he is just spinning

  function showTurns(){
    const turns = Math.floor(turnedThisSpin / 360);
    if(turns >= SHOW_FROM){
      readout.textContent = t().turns(turns);
      readout.classList.add('on');
    } else {
      readout.classList.remove('on');
    }
  }

  function frame(now){
    const dt = Math.min(0.05, (now - last) / 1000) || 0;
    last = now;
    if(held) vel = Math.min(SPIN.topSpeed, vel + SPIN.windUp * dt);
    else if(vel > 0){
      vel = Math.max(0, vel * (1 - SPIN.drag * dt) - SPIN.friction * dt);
      if(vel < SPIN.stopBelow) vel = 0;
    }
    const step = vel * dt;
    angle += step;
    turnedThisSpin += step;
    img.style.transform = `translateZ(0) rotate(${angle}deg)`;
    showTurns();
    if(turnedThisSpin >= DIZZY_TURNS * 360 && !profile.dizzy && !isPractice){
      // Hidden until it happens, which is the point of it.
      profile.dizzy = true;
      saveProfile();
      checkAchievements();          // which announces it
    }
    if(!held && vel === 0){
      raf = null;
      host.classList.remove('spinning');
      turnedThisSpin = 0;             // "in a row" means one continuous spin
      readout.classList.remove('on');
      return;                         // left at whatever angle it stopped on
    }
    raf = requestAnimationFrame(frame);
  }

  function start(held_){
    // Reduced motion used to stop this dead, which quietly made Dizzy
    // unreachable for anyone with the system setting on -- and nothing said
    // so, because there is nothing to say: you hold him and he does not move.
    // A hold is an explicit request to spin something, so it is honoured; what
    // the preference suppresses is the unasked-for flick a tap gives him.
    if(calm.matches && !held_) return;
    host.classList.add('spinning');
    if(raf === null){ last = performance.now(); raf = requestAnimationFrame(frame); }
  }

  host.addEventListener('pointerdown', (e)=>{
    e.preventDefault();               // or a long press selects the image
    pressedAt = performance.now();
    held = true;
    start(true);
    try{ host.setPointerCapture(e.pointerId); }catch(err){ /* not fatal */ }
  });
  const release = ()=>{
    if(!held) return;
    held = false;
    // A tap is worth a flick, so the gesture always does something.
    if(performance.now() - pressedAt < SPIN.tapMs && !calm.matches){
      vel = Math.max(vel, 900);
      start(false);
    }
  };
  host.addEventListener('pointerup', release);
  host.addEventListener('pointercancel', release);
  host.addEventListener('lostpointercapture', release);
  // He is inside the menu: a click on him must not reach the document handler
  // that closes it, or he would be gone before he had turned twice.
  host.addEventListener('click', (e)=>{
    e.stopPropagation();
    if(e.detail === 0){ vel = Math.max(vel, 900); start(true); }   // keyboard
  });
}

/* ---------- Guessing ---------- */
/* A guess is a point on the map. It may be given as one -- {lat, lng, country}
   from a tap -- or as a country, which is how the tests and the older saved
   states speak, and which is taken as its centre. */
function asSpot(g){
  if(!g) return null;
  if(typeof g.lat === 'number' && typeof g.lng === 'number' && !g.names){
    return g;                                   // already a placement
  }
  return { lat: g.lat, lng: g.lng, country: g };  // a country record
}

function submitGuess(input){
  if(state.round >= N_ROUNDS || roundFinished()) return;
  const spot = asSpot(input);
  if(!spot || typeof spot.lat !== 'number') return;
  const guesses = currentGuesses();
  // The same pin twice is a double-tap, not a second guess. Anywhere else is
  // allowed: placing two pins in one country is how a big country gets
  // narrowed down, which was impossible when a guess was a country.
  if(guesses.some(g => Math.abs(g.lat - spot.lat) < 0.02
                    && Math.abs(g.lng - spot.lng) < 0.02)) return;
  const country = spot.country || null;
  const target = currentTarget(), answers = targetCountries();
  // Distance runs from the pin to the *site*, so the heat points at the real
  // place rather than at the middle of a country.
  const aim = nearestAnswerPoint(spot.lat, spot.lng);
  const km = Math.round(aim.km);
  const brg = bearing(spot.lat, spot.lng, aim.lat, aim.lng);
  // Right country, or near enough to the site that the country hardly matters.
  const rightCountry = country && (answers.length
    ? answers.some(a => a.id === country.id)
    : country.names.en === target.country.en);
  const isCorrect = !!rightCountry || km <= NEAR_KM;
  guesses.push({ lat: spot.lat, lng: spot.lng,
                 id: country ? country.id : null,
                 // A snapshot, so the history still reads if the pool changes
                 // under a saved game.
                 names: country ? country.names : null,
                 km, bearing: brg,
                 bucket: isCorrect ? 'correct' : heatBucket(km),
                 // How it was won: standing in an answer country, or close
                 // enough to the site that the border stopped mattering. The
                 // verdict says which, so "right" is never a surprise.
                 via: isCorrect ? (rightCountry ? 'country' : 'near') : null,
                 // Distance alone is hard to act on. Saying which of continent
                 // and region a guess already matched turns each try into a
                 // narrowing step rather than a number to interpret.
                 // Judged against any of the answer countries, for the same
                 // reason the answer itself is: a tradition shared across two
                 // continents is not "the wrong continent".
                 // Naming the country settles the continent and the region with
                 // it. Both are measured from a country's centre against the
                 // site's own position, so a country as large as India could
                 // come back "right country, wrong region" -- which reads as a
                 // bug at exactly the moment the player has just won.
                 contOk: isCorrect || !!(country && contCodeOf(country) && (answers.length > 1
                        ? answers.some(a => contCodeOf(a) === contCodeOf(country))
                        : contCodeOf(country) === contCodeOf(target))),
                 regionOk: isCorrect || !!(country && (answers.length > 1
                        ? answers.some(a => regionOf(a) === regionOf(country))
                        : regionOf(country) === regionOf(target))) });

  const max = roundPlan(state.round).points;
  if(isCorrect){
    state.roundStatus[state.round] = 'solved';
    // Worth more the sooner it was found, so deduction is rewarded over
    // working through the allowance.
    state.roundScore[state.round] = max * solveCredit(guesses.length);
    catalogue(target, true);
    // "Sharp eye": a tier-3 entry taken on the very first guess.
    if(target.tier === 3 && guesses.length === 1 && !isPractice){
      profile.gemFirstGuess = true; saveProfile();
    }
  } else if(guesses.length >= guessesAllowed(state.round)){
    // Out of guesses. Scored on the best guess of the round rather than the
    // last, so a near miss counts even when the final try was a gamble.
    state.roundStatus[state.round] = 'failed';
    state.roundScore[state.round] = max * missCredit(guesses);
    catalogue(target, false);   // revealed on failure still enters the catalogue
  }
  saveState();
  clearPending();
  showNewestPhoto();      // a guess just earned one; show what it bought
  render();
  // On a phone the verdict panel sits just below the fold, so a guess looked
  // like it had done nothing at all. 'nearest' scrolls only when it is
  // actually off-screen, which leaves the desktop layout alone.
  if(!roundFinished()){
    document.getElementById('mapReadout')
            .scrollIntoView({ behavior:'smooth', block:'nearest' });
  }
}

/* ---------- Guessing by tapping the map ----------
   The guess is a place, not a word. Typing a country name asked the player to
   already know the answer in order to enter it; pointing at the map is the
   same act the puzzle is about.

   A tap proposes and the button commits. With three guesses a round and a map
   only 375px wide, a stray tap that spent a guess outright would be the most
   annoying thing in the game. */
let pendingGuess = null;

function clearPending(){
  pendingGuess = null;
  const p = document.getElementById('pendingGuess');
  if(p) p.hidden = true;
  renderTapHint();
}

function renderTapHint(){
  const hint = document.getElementById('tapHint');
  if(!hint) return;
  const T = t();
  if(roundFinished()){ hint.textContent = ''; return; }
  hint.textContent = pendingGuess ? T.tapAgain : T.tapPrompt;
}

/* What to call the point a pin is standing on: the country it falls in, or
   "open water" said plainly rather than left blank. Guesses record the name in
   all three languages at the time they are made, so a guess saved under an
   older pool still reads correctly. */
function placeLabel(spot){
  const names = spot && (spot.names || (spot.country && spot.country.names));
  return (names && (names[lang] || names.en)) || t().openWater;
}

function showPending(spot){
  pendingGuess = spot;
  const box = document.getElementById('pendingGuess');
  // Which country the pin is standing in, so a placement is never a mystery --
  // and "open water" said plainly rather than a blank.
  document.getElementById('pendingName').textContent = placeLabel(spot);
  document.getElementById('confirmGuess').textContent = t().confirmGuess;
  box.hidden = false;
  renderTapHint();
  // On a phone the confirm bar sits below the map, off the bottom of the
  // screen: the pin would appear with no visible way to commit it.
  box.scrollIntoView({ behavior:'smooth', block:'nearest' });
}

/* Where on the earth a point on the map is. project() is the forward map; this
   is its inverse, and it is what makes free placement possible at all. */
function unproject(x, y){
  return { lat: 90 - (y / MAP_H) * 180, lng: (x / MAP_W) * 360 - 180 };
}

function handleMapTap(evt){
  if(roundFinished() || state.round >= N_ROUNDS) return;
  if(panMoved) return;                       // that was a drag, not a tap
  const w = screenToWorld(evt.clientX, evt.clientY);
  // The pin goes exactly where the finger went. The country is read off the
  // same point and reported, but it does not move the pin and it is no longer
  // required: open water is a placement like any other, and so is a country
  // the dataset has no entries for.
  const here = unproject(w.x, w.y);
  let country = countryByIso(isoAt(w.x, w.y));
  if(!country) country = countryNear(w.x, w.y);
  showPending({ lat: here.lat, lng: here.lng, country: country || null });
  renderMapForRound();                        // draw the provisional pin
}
document.getElementById('mapSvg').addEventListener('click', handleMapTap);

/* One catalogue card. Clickable, because the card is the only place a player
   can go back to something they met in a round -- everything a finished round
   offers about an entry is offered here too. The star is a button of its own so
   favouriting does not open the card. */
function collectionCard(r){
  const T = t();
  const src = (r.image && (r.image.path || r.image.url)) || '';
  // Both are {en,fr,es}; tolerate a plain string from an older profile.
  const pick = v => !v ? '' : (typeof v === 'string' ? v : (v[lang] || v.en || ''));
  const fav = isFavourite(r.id);
  return `<div class="card${r.solved ? '' : ' missed'}" data-id="${r.id}"
               role="button" tabindex="0">
    ${src ? `<img src="${src}" alt="" loading="lazy"
              onerror="this.style.display='none'">` : ''}
    <button class="fav${fav ? ' on' : ''}" data-fav="${r.id}"
            title="${fav ? T.favRemove : T.favAdd}"
            aria-label="${fav ? T.favRemove : T.favAdd}">${fav ? '★' : '☆'}</button>
    <div class="card-body">
      <span class="acc">${accessionFor(r.id)}</span>
      <div class="card-name">${(r.names && r.names[lang]) || r.id}</div>
      <div class="card-meta">${[pick(r.country), pick(r.category), r.year]
                               .filter(Boolean).join(' · ')}</div>
      <span class="card-more">${T.cardMore}</span>
    </div></div>`;
}

function renderLinks(){

  // separating the one item that does not leave from the ones that do.

    + `${T.links[k]}</span><span aria-hidden="true">\u2197</span></a>`;
  box.innerHTML =
    // The little person lives here now, beside the one item that is about a
    // person. Holding him still winds him up, and a hundred turns still earns

    `<div class="menu-inside">

  const ig = document.getElementById('langIg');
  if(ig){
    if(LINKS.instagram){ ig.href = LINKS.instagram; ig.title = T.links.instagram; }
    else ig.hidden = true;
  }
}

function renderCollection(){

function renderPassport(){
  const T = t();
  const st = streaks();
  const days = Object.entries(profile.days).map(([d,v])=>({ day:+d, ...v }))
                     .sort((a,b)=> b.day - a.day);
  const avg = days.length
    ? Math.round(days.reduce((a,b)=>a+(b.score||0),0) / days.length) : 0;
  // Five, and the rest counted. One stamp a day for a year is a wall of
  // stamps, and the point of the row is the last week, not the archive.
  const STAMPS_SHOWN = 5;
  const stamps = days.slice(0, STAMPS_SHOWN).map(d=>{
    const tier = d.score >= 80 ? 3 : (d.score >= 40 ? 2 : 1);
    return `<div class="stamp s${tier}" title="Day ${d.day}">
      <b>${Math.round(d.score)}</b><span>#${d.day}</span></div>`;
  }).join('');
  // Earned on the page, locked out of sight. Twenty-two rows of mostly grey is
  // a list of things you have not done; what a player comes back to is the page
  // of stamps they have. The rest are one tap away for whoever wants to know.
  //
  // Three to a row, the stamp and its name on the tile, and the description
  // only when asked for -- a full-width row each turns a page of stamps into a
  // list again, which is the opposite of what a passport looks like.
  const shown = visibleAchievements();
  // Earned in the order they were earned, newest first: a passport is a record
  // of where you have been and when, and the newest stamp is the one a player
  // came back to look at. Anything earned before the dates were kept sorts to
  // the end rather than jumping to the front on a zero.
  const RANK_ORDER = { prestige: 0, secret: 1, rare: 2, common: 3 };
  const earned = shown.filter(a => profile.achievements.includes(a.id))
    .sort((a, b) => (profile.achievementsAt[b.id] || 0)
                  - (profile.achievementsAt[a.id] || 0));
  // Still to find, hardest last: the ladder reads as a ladder.
  const locked = shown.filter(a => !profile.achievements.includes(a.id))
    .sort((a, b) => RANK_ORDER[achClass(b)] - RANK_ORDER[achClass(a)]);
  const achEarned = earned.length
    ? achGrid(earned, true)
    : `<p class="ach-empty">${T.achEmpty}</p>`;
  const achLocked = locked.length
    ? `<details class="ach-locked"><summary>${T.achLocked}
         <span class="count">${locked.length}</span></summary>
       ${achGrid(locked, false)}</details>`
    : `<p class="ach-empty">${T.achLockedNone}</p>`;
  const ach = achEarned + achLocked;
  document.getElementById('viewPassport').innerHTML =
    `<div class="panel-head"><h2>${T.passportTitle}</h2><p>${T.passportSub}</p></div>
     <div class="stats">
       <div class="stat"><b>${st.played}</b><span>${T.statPlayed}</span></div>
       <div class="stat"><b>${st.current}</b><span>${T.statStreak}</span></div>
       <div class="stat"><b>${st.best}</b><span>${T.statBest}</span></div>
       <div class="stat"><b>${avg}</b><span>${T.statAvg}</span></div>
     </div>
     <div class="stamps">${stamps}${
       days.length > STAMPS_SHOWN
         ? `<span class="stamps-more">${T.stampsMore(days.length - STAMPS_SHOWN)}</span>`
         : ''}</div>
     <div class="panel-head" style="margin-top:20px"><h2>${T.achTitle}</h2>
       <p>${T.achEarned} ${earned.length} / ${shown.length}</p></div>
     ${ach}
     <label class="cb-row"><input type="checkbox" id="cbToggle"
       ${cbOn() ? 'checked' : ''}> ${T.cbLabel}</label>
     <p class="cb-note">${T.cbNote}</p>
     <details class="backup">
       <summary>${T.backupTitle}</summary>
       <p class="cb-note">${T.backupNote}</p>
       <textarea id="backupCode" readonly rows="3"
                 aria-label="${T.backupTitle}"></textarea>
       <div class="backup-row">
         <button class="btn small" id="backupCopy">${T.backupCopy}</button>
         <span class="backup-said" id="backupSaid"></span>
       </div>
       <p class="cb-note">${T.restoreNote}</p>
       <textarea id="restoreCode" rows="3" placeholder="${T.restorePlaceholder}"
                 aria-label="${T.restoreTitle}"></textarea>
       <div class="backup-row">
         <button class="btn small secondary" id="restoreGo">${T.restoreTitle}</button>
         <span class="backup-said" id="restoreSaid"></span>
       </div>
     </details>`;
  document.getElementById('cbToggle').onchange = e=>{
    profile.colorblind = e.target.checked; saveProfile(); applyColorblind(); render();
  };
  // Filled after the markup is in place, because the code is long and putting
  // it in the template would need escaping it twice.
  const codeBox = document.getElementById('backupCode');
  if(codeBox) codeBox.value = exportProfile();
  const copyBtn = document.getElementById('backupCopy');
  if(copyBtn) copyBtn.onclick = ()=>{
    const said = document.getElementById('backupSaid');
    const done = ()=> { if(said) said.textContent = T.backupCopied; };
    // The clipboard API needs a secure context and permission; selecting the
    // text is the fallback that works everywhere, including file://.
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(codeBox.value).then(done, ()=>{
        codeBox.select(); if(said) said.textContent = T.backupSelect;
      });
    }else{
      codeBox.select();
      if(said) said.textContent = T.backupSelect;
    }
  };
  const restoreBtn = document.getElementById('restoreGo');
  if(restoreBtn) restoreBtn.onclick = ()=>{
    const said = document.getElementById('restoreSaid');
    const result = importProfile(document.getElementById('restoreCode').value);
    if(!result){ if(said) said.textContent = T.restoreBad; return; }
    if(said) said.textContent = T.restoreDone(result.entries, result.days);
    renderPassport();
    // The message is written into the freshly rendered panel, or it would
    // vanish with the one it was written into.
    const after = document.getElementById('restoreSaid');
    if(after) after.textContent = T.restoreDone(result.entries, result.days);
  };
  document.querySelectorAll('#viewPassport [data-ach]').forEach(tile=>{
    tile.addEventListener('click', ()=>{
      // Tapping the open one closes it, so the grid can go back to being a grid.
      achOpen = (achOpen === tile.dataset.ach) ? null : tile.dataset.ach;
      const wasOpen = document.querySelector('.ach-locked')?.hasAttribute('open');
      renderPassport();
      // Re-rendering would otherwise fold the locked list shut under the hand
      // of whoever just tapped something inside it.
      if(wasOpen) document.querySelector('.ach-locked')?.setAttribute('open', '');
    });
  });
}

/* Which distinction is showing its description, if any. */
let achOpen = null;

/* A grid of stamps, with the description of the open one spliced in at the end
   of its own row rather than at the bottom of the grid -- on a page of twenty
   tiles, a detail panel far from the tile you tapped reads as unrelated. */
/* The class a stamp is drawn in: its rank, or 'secret' for the ones nobody is
   told about, which are not a rank so much as a different kind of thing. */
function achClass(a){
  return a.secret ? 'secret' : (a.rank || 'common');
}

function achGrid(list, got){
  const cols = 3;
  const T = t();
  const open = list.find(a => a.id === achOpen);
  const out = [];
  list.forEach((a, i)=>{
    const [name] = achText(a);
    const when = got ? earnedOn(a.id) : '';
    out.push(`<button class="ach-tile r-${achClass(a)}${got ? '' : ' locked'}` +
             `${achOpen === a.id ? ' on' : ''}" data-ach="${a.id}"` +
             ` aria-expanded="${achOpen === a.id}">` +
             `${stampSvg(a.mark, got)}<span>${name}</span>` +
             `${when ? `<time class="ach-when">${when}</time>` : ''}</button>`);
    const rowStart = Math.floor(i / cols) * cols;
    const lastInRow = (i % cols === cols - 1) || i === list.length - 1;
    if(open && lastInRow && list.slice(rowStart, i + 1).some(x => x.id === achOpen)){
      const [name2, desc] = achText(open);
      const on = got ? earnedOn(open.id) : '';
      out.push(`<div class="ach-detail r-${achClass(open)}">${stampSvg(open.mark, got)}
        <div><b>${name2}</b><span>${desc}</span>
        <span class="ach-meta">${T.rankNames[achClass(open)]}${
          on ? ` \u00b7 ${T.earnedOnLabel} ${on}` : ''}</span></div></div>`);
    }
  });
  return `<div class="ach-grid">${out.join('')}</div>`;
}

/* What a past day held. Played or not, the four entries are knowable -- a
   finished day carries its ids, and any other day can be dealt again, because
   the deal is a pure function of the date. Closing the back catalogue took the
   replay away, which was right, but it also took away any way of finding out
   what a missed day even was, and an archive that lists sixty dates and
   nothing else is a calendar.

   Seeing is not collecting. Nothing here calls catalogue(), so a day looked up
   in the archive never enters the collection and never counts towards a
   distinction: the entries are shown, the credit is not given. Today is never
   revealed, for obvious reasons. */
let archOpen = null;

function archiveEntries(day){
  const rec = profile.days[day];
  const ids = (rec && Array.isArray(rec.ids) && rec.ids.length) ? rec.ids : null;
  const fromIds = ids ? ids.map(id => BY_ID.get(id)).filter(Boolean) : [];
  return fromIds.length ? fromIds : dealFor(day);
}

function renderArchive(){
  const T = t();
  const rows = [];
  for(let d = todayIndex; d >= Math.max(0, todayIndex - 60); d--){
    const rec = profile.days[d];
    const date = new Date(EPOCH + d * 86400000).toISOString().slice(0,10);
    // A replay only where there is something to go back to: today, or a day
    // this player finished. An unplayed day has no replay, because that link
    // was the back catalogue.
    // Every past day can be practised now, finished or not.
    const replayable = true;
    const past = d < todayIndex;
    const open = archOpen === d;
    let reveal = '';
    if(past && open){
      const entries = archiveEntries(d);
      reveal = `<div class="arch-reveal">
        <p class="arch-note">${T.archiveNoCredit}</p>
        ${entries.map(e => {
          const shot = (e.photos && e.photos[0]) || e.image;
          const src = (shot && (shot.path || shot.url)) || '';
          return `<button class="arch-entry" data-arch-entry="${e.id}">
            ${src ? `<img src="${src}" alt="" loading="lazy">`
                  : `<span class="arch-noimg"></span>`}
            <span class="arch-entry-text">
              <b>${(e.names && (e.names[lang] || e.names.en)) || e.id}</b>
              <span>${[typeof e.country === 'string' ? e.country
                        : (e.country && (e.country[lang] || e.country.en)),
                       e.year].filter(Boolean).join(' · ')}</span>
            </span>
            ${profile.collection[e.id] ? `<span class="arch-have">${T.archiveDone}</span>` : ''}
          </button>`;
        }).join('')}
      </div>`;
    }
    rows.push(`<div class="arch-item">
      <div class="arch-row">
        <span class="arch-day">${date}${d===todayIndex ? ' \u00b7' : ''}</span>
        <span class="arch-score">${rec ? T.scoreOf(Math.round(rec.score), MAX_SCORE) : '\u2014'}</span>
        ${past ? `<button class="arch-peek" data-arch-day="${d}"
                    aria-expanded="${open}">${open ? T.archiveHide : T.archiveShow}</button>` : ''}
        ${(past && !rec) ? `<span class="arch-locked">${T.archiveMissed}</span>` : ''}
        ${replayable
          ? `<a class="btn secondary" style="font-size:0.68rem;padding:7px 11px"
                href="${d === todayIndex ? '.' : '?day=' + d + '&practice=1'}">${
                  d===todayIndex ? T.navGame : (rec ? T.archiveOpen : T.archiveTry)}</a>`
          : ''}
      </div>
      ${reveal}
    </div>`);
  }
  document.getElementById('viewArchive').innerHTML =
    `<div class="panel-head"><h2>${T.archiveTitle}</h2><p>${T.archiveSub}</p></div>
     <div class="arch-list">${rows.join('')}</div>`;
  document.querySelectorAll('#viewArchive [data-arch-day]').forEach(btn=>{
    btn.onclick = ()=>{
      const d = Number(btn.dataset.archDay);
      archOpen = (archOpen === d) ? null : d;
      renderArchive();
    };
  });
  document.querySelectorAll('#viewArchive [data-arch-entry]').forEach(btn=>{
    btn.onclick = ()=>{
      const e = BY_ID.get(btn.dataset.archEntry);
      // The record, when there is one, so a catalogued entry keeps its
      // accession number; otherwise the live entry, read-only.
      if(e) openInfoModal(e, profile.collection[e.id] || null);
    };
  });
}

/* ---------- Another app's browser ----------
   Instagram, Facebook and the rest open links in a webview of their own, with
   its own storage. So a player who taps the link in a bio is not in the
   browser they normally play in: the collection, the streak and the passport
   are all in the other one, and this looks like the game has forgotten them.

   Nothing can be done about that from inside the page -- the two jars cannot
   see each other -- so the only useful thing is to say so, once, quietly, and
   point at the backup code for anyone who wants to carry a collection across. */
const IN_APP = /Instagram|FBAN|FBAV|FB_IAB|FBIOS|Line\/|MicroMessenger|TikTok|Snapchat/i;
const INAPP_KEY = 'heritle-inapp-seen';

function maybeInAppNote(){
  const el = document.getElementById('inappNote');
  if(!el || !IN_APP.test(navigator.userAgent || '')) return;
  if(lsGet(INAPP_KEY)) return;
  const T = t();
  el.innerHTML = `<p>${T.inAppNote}</p>`
    + `<button type="button" aria-label="${T.close}">&times;</button>`;
  el.hidden = false;
  el.querySelector('button').onclick = ()=>{
    el.hidden = true;
    lsSet(INAPP_KEY, '1');
  };
}

/* ---------- Countdown ----------
   It counted to the next UTC midnight while the puzzle turns over at the
   player's own midnight, which are the same instant for almost nobody. In
   Paris the clock hit zero at 02:00 and then showed nothing for the next
   twenty-two hours; in New York it emptied at 19:00, five hours early. It
   counts to local midnight now, which is when the day actually changes.

   And when it gets there it says so. `now` is read once, at load, so a tab
   left open overnight kept serving yesterday's puzzle to a board that looked
   current -- a player who left it open would guess at a site that was no
   longer the day's, and their save would be written under yesterday's key. */
function nextLocalMidnight(){
  const d = new Date();
  return new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1).getTime();
}
function renderCountdown(){
  const T = t();
  const el = document.getElementById('countdown');
  if(!el) return;
  let target = nextLocalMidnight();
  const tick = ()=>{
    const left = target - Date.now();
    if(left <= 0){
      // The day turned under an open tab. Offer the new one rather than
      // reloading from under a player who may be mid-round.
      el.innerHTML = `<button class="btn small" id="newDayBtn">${T.newDay}</button>`;
      const btn = document.getElementById('newDayBtn');
      if(btn) btn.onclick = ()=> location.assign('.');
      clearInterval(renderCountdown._t);
      return;
    }
    const h = String(Math.floor(left/3600000)).padStart(2,'0');
    const m = String(Math.floor(left/60000) % 60).padStart(2,'0');
    const sec = String(Math.floor(left/1000) % 60).padStart(2,'0');
    el.innerHTML = `${T.nextIn} <b>${h}:${m}:${sec}</b>`;
  };
  tick();
  clearInterval(renderCountdown._t);
  renderCountdown._t = setInterval(tick, 1000);
}
// A phone does not run timers in a backgrounded tab, so the countdown can be
// hours stale by the time it is looked at again.
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden && typeof renderCountdown === 'function') renderCountdown();
});

/* ---------- Field Notes (first visit only) ---------- */
function maybeFieldNotes(){
  if(profile.seenFieldNotes) return;
  const T = t();
  document.getElementById('fnTitle').textContent = T.fieldNotesTitle;
  document.getElementById('fnBody').innerHTML =
    T.fieldNotes.map(p=>`<p>${p}</p>`).join('');
  document.getElementById('fnClose').textContent = T.fieldNotesBtn;
  document.getElementById('fieldNotesBackdrop').classList.add('open');
}
document.getElementById('fnClose').addEventListener('click', ()=>{
  document.getElementById('fieldNotesBackdrop').classList.remove('open');
  profile.seenFieldNotes = true; saveProfile();
});

/* ---------- Init ---------- */
/* ---------- Answers have to be reachable ----------
   The guess is a tap, so a country the map cannot resolve a tap to cannot be
   an answer -- a round whose only answer is unreachable is unwinnable. The
   pipeline already drops countries with no ISO code, but it does not know what
   the map can actually hit: Vatican City is 400 metres across, has no polygon
   at this resolution, and sits inside Italy, so every tap on it returns Italy.

   Enforced here rather than in the pipeline because this is the only place
   that has both the dataset and the geometry, and it re-checks itself whenever
   either changes. */
function pruneUnreachable(){
  if(!LAND_SHAPES || !COUNTRIES.length) return;
  const ok = new Set();
  for(const c of COUNTRIES){
    if(!c.iso) continue;
    if(LAND_SHAPES[c.iso]){ ok.add(c.id); continue; }   // tap inside it
    const p = project(c.lat, c.lng);                     // or snap to it
    const got = countryByIso(isoAt(p.x, p.y)) || countryNear(p.x, p.y);
    if(got && got.id === c.id) ok.add(c.id);
  }
  const lostCountries = COUNTRIES.filter(c => !ok.has(c.id)).map(c => c.names.en);
  COUNTRIES = COUNTRIES.filter(c => ok.has(c.id));
  const before = POOL.length;
  POOL = POOL.filter(e => {
    const ids = (e.countryIds || []).filter(id => ok.has(id));
    if(!ids.length) return false;
    // Keep the entry, but only the answers a player could actually give.
    if(ids.length !== (e.countryIds || []).length){
      e.countryNames = e.countryNames.filter((_, i) => ok.has(e.countryIds[i]));
      e.countryIds = ids;
      if(e.countryNames.length) e.country = e.countryNames[0];
    }
    return true;
  });
  if(lostCountries.length || POOL.length !== before){
    console.warn('Heritle: dropped ' + lostCountries.length +
      ' country/countries the map cannot resolve (' + lostCountries.join(', ') +
      ') and ' + (before - POOL.length) + ' entry/entries left with no reachable answer.');
  }
  BY_ID = new Map(POOL.map(d => [d.id, d]));
  computeTargets();
}

// Both in parallel: the map geometry is independent of the dataset, and
// neither blocks the other. loadLand never rejects -- a missing file falls
// back to the built-in outline -- so the game still starts if it is absent.
Promise.all([loadDataset(), loadLand()]).then(()=>{
  pruneUnreachable();
  applyColorblind();
  if(isPractice){
    const b = document.createElement('div');
    b.className = 'practice-banner';
    const date = new Date(EPOCH + dayIndex * 86400000).toISOString().slice(0, 10);
    // Which day this is, and the way back to where it was chosen from. A
    // practice run reached from the archive should return there, not dump the
    // player on today with no idea what happened.
    b.innerHTML = `${t().practiceBadge} · ${date} · `
      + `<a href="./?view=archive" style="color:var(--gold)">${t().backToArchive}</a>`;
    document.getElementById('viewGame').prepend(b);
  }
  render();
  renderNav();
  renderCountdown();
  noteLang();
  maybeInAppNote();
  // Deep-linked back from a practice run: land where it was chosen from.
  if(openView === 'archive') showView('Archive');
  else maybeFieldNotes();
});
</script>
</body>
</html>
