/* The language a visitor gets, in order of what actually knows best: what they
   last chose here, then what their browser says, then English.

   This control used to sit in the header's strongest slot wearing the brightest
   colour in the palette, and the reason was that it had to: nothing detected
   the language and nothing remembered the choice, so a French speaker reset it
   on every single visit. Prominence was compensating for a missing feature.
   With detection and persistence it becomes a rare correction, and can be
   quiet. */
const LANG_KEY = 'heritle-lang';

/* ---------- Storage, which is allowed to fail ----------
   Every one of these calls can throw, and a throw here is fatal in a way
   nothing else in the game is: the reads run at the top level, so one bad
   value blanks the page, and the player cannot clear it without opening
   devtools. The writes are worse than they look -- saveState() is called from
   the middle of submitGuess(), so a throw there abandons the guess before the
   board is re-rendered, and the game appears to have stopped accepting input.

   Causes seen in the wild: private browsing with a zero quota, a full quota, a
   browser extension replacing the storage object, and a half-written value
   from a tab killed mid-write. None of them are the player's fault, and none
   should cost more than the memory of the game. */
function lsGet(key){
  try{ return localStorage.getItem(key); }catch(e){ return null; }
}
function lsSet(key, value){
  try{ localStorage.setItem(key, value); return true; }catch(e){ return false; }
}
function lsRemove(key){
  try{ localStorage.removeItem(key); }catch(e){ /* nothing to remove */ }
}
/* A stored blob that will not parse is a lost save, not a crash. */
function lsJSON(key, fallback){
  const raw = lsGet(key);
  if(!raw) return fallback;
  try{
    const parsed = JSON.parse(raw);
    return (parsed && typeof parsed === 'object') ? parsed : fallback;
  }catch(e){
    lsRemove(key);            // it could only fail forever otherwise
    return fallback;
  }
}

function initialLang(){
  const saved = lsGet(LANG_KEY);
  if(saved && UI[saved]) return saved;
  const nav = (navigator.languages || [navigator.language || 'en'])
                .map(l => String(l).slice(0,2).toLowerCase());
  return nav.find(l => UI[l]) || 'en';
}
let lang = initialLang();
// Noted on load as well as on a switch: a player who reads it in French from
// the first visit never touches the language control.
function noteLang(){
  if(typeof profile === 'undefined' || isPractice) return;
  if(profile.langsUsed[lang]) return;
  profile.langsUsed[lang] = Date.now();
  saveProfile();
}
function t(){ return UI[lang]; }

/* ---------- Dataset loading ----------
   data/dataset.json is { meta, countries, entries }. Entries carry categorical
   codes (continent:'EU', category:'cultural') and a country QID rather than
   prose, so the three languages come from the UI table above and can't be left
   half-translated by patchy Wikidata coverage. normaliseEntry() expands that
   back into the same shape as FALLBACK_DATA, so every render path below is
   indifferent to which source it got. */
function normaliseEntry(e, countries){
  const country = countries[e.country] || null;
  const per = (pick) => ({ en:pick('en'), fr:pick('fr'), es:pick('es') });
  // An element inscribed by several states has several right answers. The
  // pipeline only emits `countries` when there is more than one, so fall back
  // to the single primary.
  const allIds = (e.countries && e.countries.length ? e.countries : [e.country])
                   .filter(id => countries[id]);
  return {
    id: e.id, type: e.type, tier: e.tier, lat: e.lat, lng: e.lng,
    year: e.year, approx: e.approx, image: e.image,
    qid: e.qid, siteId: e.siteId, wiki: e.wiki, officialUrl: e.officialUrl,
    photos: (e.photos && e.photos.length) ? e.photos : (e.image ? [e.image] : []),
    continentCode: e.continent,
    names: e.names,
    aliases: e.aliases || [],
    countryIds: allIds,
    countryNames: allIds.map(id => countries[id]),
    country:   per(l => country ? country[l] : (UI[l].unknown)),
    continent: per(l => (UI[l].continents[e.continent]) || UI[l].unknown),
    category:  per(l => (UI[l].categories[e.category]) || UI[l].unknown),
    clue:      e.desc ? per(l => e.desc[l] || e.desc.en || '') : null
  };
}

let POOL = FALLBACK_DATA;
let BY_ID = new Map();
let targets = [];
/* The guessing vocabulary. Players guess countries, never site names: with
   ~1,270 inscriptions, most of them places nobody could name unprompted, the
   name was never a fair thing to ask for. The map is the puzzle. */
let COUNTRIES = [];
let COUNTRY_NAMES = {};   // qid -> {en,fr,es}, for catalogue cards after reload

/* Region is derived here rather than stored, so it needs no pipeline field and
   can never contradict the coordinate it describes. It's the compass sector of
   the entry within its continent -- broad enough to narrow the search without
   naming the answer. */
/* The demo set stores continent names rather than codes, so fall back to a
   reverse lookup off the English name. */
function contCodeOf(entry){
  if(!entry) return null;
  return entry.continentCode ||
    Object.keys(UI.en.continents).find(k => UI.en.continents[k] === (entry.continent||{}).en) ||
    null;
}

function regionOf(entry){
  const T = t();
  const code = contCodeOf(entry);
  const cont = (UI[lang].continents[code]) || (entry.continent||{})[lang] || UI[lang].unknown;
  const band = CONTINENT_BANDS[code];
  if(!band) return cont;
  const vert = entry.lat >= band.lat[1] ? 'N' : (entry.lat <= band.lat[0] ? 'S' : null);
  const horiz = entry.lng >= band.lng[1] ? 'E' : (entry.lng <= band.lng[0] ? 'W' : null);
  const dirKey = vert || horiz || 'C';
  return T.regionOf(T.regions[dirKey], cont);
}

/* Tercile cut points per continent, so "Northern"/"Eastern" mean something
   relative to that landmass rather than to the globe. */
const CONTINENT_BANDS = {
  EU: { lat:[45, 55],   lng:[0, 25] },
  AS: { lat:[20, 40],   lng:[60, 105] },
  AF: { lat:[-10, 15],  lng:[5, 30] },
  NA: { lat:[20, 45],   lng:[-110, -80] },
  SA: { lat:[-25, -5],  lng:[-70, -50] },
  OC: { lat:[-30, -15], lng:[135, 165] },
  AN: { lat:[-80, -70], lng:[-60, 60] }
};

function buildCountries(table){
  // Only countries with a coordinate can be guessed — every guess is measured
  // from the country's centroid to the target.
  return Object.entries(table)
    .filter(([, c]) => typeof c.lat === 'number' && typeof c.lng === 'number')
    .map(([qid, c]) => ({ id: qid, lat: c.lat, lng: c.lng, continentCode: c.cont,
                          iso: c.iso || null,
                          names: { en: c.en, fr: c.fr, es: c.es } }));
}

/* ---------- Day / targets (one per tier) ---------- */
/* Launch day. Day one of the public game is the day it opened, not a date
   picked while building it -- with the old epoch the first visitor would have
   been handed puzzle 620 and an archive of six hundred days nobody played.
   Moving this re-deals every day's puzzle, so it moves once, at launch. */
const EPOCH = Date.UTC(2026,8,11);
const now = new Date();
const todayIndex = Math.floor((Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) - EPOCH) / 86400000);

/* Which puzzle you are on comes from the date, and essentially only from it.

   It used to be overridable with ?day=N, and the archive linked to exactly
   that for each of the last sixty days -- so the whole back catalogue was one
   URL edit away and could be worked through from day one by counting upwards.
   The daily puzzle is the game; that turned it into a list you could binge.

   Now a replay is only possible for a day you have already finished: ?day=N is
   honoured when your own history has a record for N, and ignored otherwise.
   Replaying something you have already seen spoils nothing.

   Tests pin the day with HERITLE_TEST_DAY, set before this script runs, because
   a test needs determinism and a URL parameter is the wrong way to get it.

   Being straight about the limit: history lives in localStorage, so anyone who
   opens devtools can still forge a record and reach any day. What this closes
   is the back catalogue being a *link* -- something you can share, or walk up
   one number at a time without knowing anything. That was the actual hole. */
const params = new URLSearchParams(location.search);

/* Instagram appends its own tracking to every outbound link -- utm_source,
   utm_medium, utm_content and an fbclid a hundred characters long. The game
   ignores them, but they sit in the address bar, they get copied when somebody
   shares the page, and they make one player's URL look nothing like another's.
   Read first, then swept: replaceState leaves no history entry, so Back still
   goes where it went. */
(function sweepTracking(){
  if(!location.search || !window.history || !history.replaceState) return;
  const keep = new URLSearchParams(location.search);
  let dropped = false;
  [...keep.keys()].forEach(k => {
    if(/^(utm_|fbclid$|gclid$|igshid$|mc_|ref$|ref_src$)/i.test(k)){
      keep.delete(k);
      dropped = true;
    }
  });
  if(!dropped) return;
  const q = keep.toString();
  history.replaceState(null, '', location.pathname + (q ? '?' + q : '') + location.hash);
})();

function finishedDays(){
  const p = lsJSON('heritle-profile', {});
  return (p && typeof p.days === 'object' && p.days) ? p.days : {};
}

const dayIndex = (function pickDay(){
  const injected = window.HERITLE_TEST_DAY;
  if(typeof injected === 'number' && Number.isFinite(injected)){
    return Math.max(0, Math.floor(injected));
  }
  const asked = parseInt(params.get('day'), 10);
  // Any day that has already happened can be opened again -- but only as
  // practice, which is what the archive links to. A practice day is not
  // scored, not recorded, and nothing met in it is catalogued, so the back
  // catalogue cannot be farmed for a collection or a score; what it gives
  // back is the puzzle itself, for anyone who missed it.
  //
  // Today is never reachable this way, and neither is tomorrow: the day has
  // to be in the past, which is the one thing worth enforcing here.
  if(Number.isFinite(asked) && asked >= 0 && asked < todayIndex){
    return asked;
  }
  return todayIndex;
})();
const isPractice = dayIndex !== todayIndex || params.get('practice') === '1';
// Where to land after the deep link: the archive is where a practice day was
// chosen, so it is where "back" means.
const openView = params.get('view');

/* Deterministic per-day pick. A plain dayIndex % pool.length would walk the
   fame-sorted pool in order, so consecutive days would be near-identical in
   obscurity; hashing spreads them while staying reproducible for everyone. */
/* The pick used to be hash(day, slot) % pool.length, which is sampling with
   replacement -- the birthday problem, and it showed. Measured over the real
   pools by replaying five years of deals:

     round              pool   first repeat   distinct days in year 1
     site 1 (famous)     419   day 24          243 of 365
     site 2              417   day 27          246
     site 3 (gem)        382   day 30          232
     bonus tradition     297   day 23          204

   So a player in their first month already met a site twice, a third of the
   first year re-dealt something that round had already shown, and after five
   years 371 of the 1,872 entries had never once been dealt. For a game whose
   whole argument is "you do not know how much is on these lists", handing back
   the same ninth of them is the one failure that matters.

   Now each pool is dealt as a permutation: a deterministic shuffle of the
   whole pool, walked one entry a day, so nothing repeats until the pool is
   exhausted -- 419, 417, 382 and 297 days respectively, the traditions being
   the binding one. The next pass through comes in a different order, because
   the shuffle is seeded by the cycle number as well as the slot.

   Everything here is a pure function of (day, slot, pool): no state, no
   server, and every player still gets the same puzzle. */
function mulberry32(a){
  return function(){
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
/* The order a pool is dealt in for one pass through it. */
const dealOrders = new Map();
function dealOrder(n, slot, cycle){
  const key = n + ':' + slot + ':' + cycle;
  const had = dealOrders.get(key);
  if(had) return had;
  let seed = Math.imul(slot + 1, 2654435761) ^ Math.imul(cycle + 1, 40503);
  seed ^= seed >>> 15; seed = Math.imul(seed, 2246822519); seed ^= seed >>> 13;
  const rnd = mulberry32(seed >>> 0);
  const order = Array.from({ length: n }, (_, i) => i);
  for(let i = n - 1; i > 0; i--){          // Fisher-Yates: a permutation, not a sample
    const j = Math.floor(rnd() * (i + 1));
    const tmp = order[i]; order[i] = order[j]; order[j] = tmp;
  }
  dealOrders.set(key, order);
  return order;
}

/* Each day: three World Heritage sites, ramping from widely recognised to
   hidden gem, then one intangible element as a bonus round.

   The bonus round had a single guess, and a single guess is not a round: a
   tradition is far harder to place than a building -- no architecture, no
   vegetation, no signage -- so one try meant it was lost by default rather
   than played. It gets the same allowance as the rest, and the ladder of
   photographs that comes with them, while staying drawn from tier 1.

   Four guesses rather than three: a wrong-but-neighbouring guess is the most
   common way to be close, and three tries left no room to work inwards from
   one. */
const ROUND_PLAN = [
  { type: 'material',   tier: 1, guesses: 4, points: 100/3 },
  { type: 'material',   tier: 2, guesses: 4, points: 100/3 },
  { type: 'material',   tier: 3, guesses: 4, points: 100/3 },
  // The bonus round walks the traditions in fame order and then keeps going:
  // tier 1 for its first 297 days, then tier 2, then tier 3, and round again.
  // Drawn from tier 1 alone it could only ever reach 297 of the 653 living
  // traditions in the dataset -- 356 of them, the least famous and the most
  // fragile, would never once have been dealt. For a game that argues a
  // tradition nobody has heard of is one bad decade from disappearing, that
  // was the wrong 356 to leave out.
  { type: 'immaterial', tier: 1, tiers: [1, 2, 3],
    guesses: 4, points: 50, bonus: true }
];
const N_ROUNDS = ROUND_PLAN.length;
const MAX_SCORE = Math.round(ROUND_PLAN.reduce((a, r) => a + r.points, 0));
function roundPlan(i){ return ROUND_PLAN[i] || ROUND_PLAN[0]; }
function guessesAllowed(i){ return roundPlan(i).guesses; }

/* Sorted by id, so the order a pool is dealt in depends on what is in the pool
   and not on the order the dataset happened to list it. */
function byId(entries){
  return entries.slice().sort((a, b) => a.id < b.id ? -1 : a.id > b.id ? 1 : 0);
}

/* The deck a round is dealt from for one pass: its pools in fame order, each
   shuffled inside itself. One pool for a site round; three for the bonus, so
   the ramp survives the cycle while every tradition still gets its day. */
function deckFor(slot, pools, cycle){
  const deck = [];
  pools.forEach((pool, block) => {
    dealOrder(pool.length, slot * 8 + block, cycle).forEach(i => deck.push(pool[i]));
  });
  return deck;
}

/* The day's four entries, for any day. Taking the day as an argument rather
   than closing over dayIndex is what makes this checkable: the tests deal
   whole cycles through the real function instead of a copy of it. */
function dealFor(day){
  const used = new Set();
  return ROUND_PLAN.map((plan, slot) => {
    const tiers = plan.tiers || [plan.tier];
    // Narrow to type+tier, then relax rather than leave a round unfillable:
    // type+tiers -> type -> tier -> anything.
    const tries = [
      tiers.map(t => byId(POOL.filter(d => d.type === plan.type && d.tier === t))),
      [byId(POOL.filter(d => d.type === plan.type))],
      [byId(POOL.filter(d => d.tier === plan.tier))],
      [byId(POOL)]
    ];
    for(const raw of tries){
      const pools = raw.filter(p => p.length);
      const n = pools.reduce((a, p) => a + p.length, 0);
      if(!n) continue;
      const deck = deckFor(slot, pools, Math.floor(day / n));
      const at = ((day % n) + n) % n;
      // Step along the deck for the rare same-day clash -- two rounds relaxed
      // onto one pool -- rather than re-dealing, which would put the cycle out
      // of step with itself.
      for(let k = 0; k < n; k++){
        const pick = deck[(at + k) % n];
        if(!used.has(pick.id)){ used.add(pick.id); return pick; }
      }
    }
    return null;
  }).filter(Boolean);
}

/* A day is dealt once and then remembered, because the deal is a function of
   the dataset and the dataset moves. Tiers are rank tertiles of sitelink
   counts and the deal walks a permutation of each pool, so regenerating
   data/dataset.json -- a new inscription, a changed sitelink count, an entry
   whose country the map cannot answer -- reshuffles pools and re-deals days
   that have already been played. Two things went wrong with that:

     a puzzle could change under a player mid-round, if the file was replaced
     between two visits on the same day;

     and every past day replayed from the archive as a different puzzle, so
     the archive quietly described something that never happened.

   The four ids are written into the day's own save the first time it is
   dealt, and into the passport record when the day is finished, which is what
   outlives the daily key. A remembered day is rebuilt from those ids; if an
   entry has since left the pool entirely it is dealt fresh, because a round
   that cannot be rendered is worse than a round that changed. */
function frozenIds(){
  if(Array.isArray(state.ids) && state.ids.length) return state.ids;
  const rec = profile.days && profile.days[dayIndex];
  if(rec && Array.isArray(rec.ids) && rec.ids.length) return rec.ids;
  return null;
}
function computeTargets(){
  BY_ID = new Map(POOL.map(d => [d.id, d]));
  const remembered = frozenIds();
  let fresh = null;                      // dealt only if something is missing
  const dealNow = ()=> (fresh || (fresh = dealFor(dayIndex)));

  let picked;
  if(remembered && remembered.length === N_ROUNDS){
    const used = new Set();
    const kept = remembered.map(id => {
      const e = BY_ID.get(id);
      if(!e || used.has(e.id)) return null;
      used.add(e.id);
      return e;
    });
    if(kept.every(Boolean)){
      picked = kept;
    }else{
      // One entry has left the pool. Replace that slot only: re-dealing the
      // whole day would throw away three rounds that are still perfectly good.
      const spares = dealNow().filter(e => !used.has(e.id));
      picked = kept.map(e => e || spares.shift() || null);
      picked = picked.every(Boolean) ? picked : null;
    }
  }
  targets = picked || dealNow();
  if(targets.length === N_ROUNDS){
    const ids = targets.map(e => e.id);
    if(String(ids) !== String(state.ids)){ state.ids = ids; saveState(); }
  }
}

/* ---------- Detailed map geometry ----------
   The path compiled into this file is Natural Earth 110m land on integer
   coordinates -- one unit is about 90 km, which is fine for the world view and
   falls apart the moment you zoom. tools/build_land.py compiles a far finer
   one, with country borders as well as coastline, into data/land.json. It is
   fetched rather than inlined so this file stays openable on its own: over
   file:// the fetch fails and the coarse path draws the world as before. */
let LAND_PATH = null;          // detailed geometry, once it arrives
let LAND_PIECES = null;        // the same geometry, one path per country
let LAND_SHAPES = null;        // ISO -> rings, for resolving a tap to a country
let SHAPE_BOX = null;          // ISO -> bounding box, to skip most countries
async function loadLand(){
  try{
    const res = await fetch('data/land.json', { cache: 'no-cache' });
    if(!res.ok) throw new Error(res.status);
    const d = await res.json();
    // Geometry is pre-projected to this exact canvas; a file built for a
    // different one would put every coastline in the wrong place.
    if(!d.shapes || !Object.keys(d.shapes).length) throw new Error('no shapes');
    if(d.width !== MAP_W || d.height !== MAP_H) throw new Error('canvas mismatch');
    LAND_SHAPES = d.shapes;
    // One copy of the geometry: the rings are hit-tested, and the drawing path
    // is built from those same rings, so the two cannot describe different
    // coastlines. Built once -- it is ~39k vertices.
    // One path per country rather than one for the world. A single 187k-point
    // path has to be re-rasterised in full on every view change, because the
    // renderer can only cull whole drawing objects and there is just the one;
    // split up, everything off-screen is dropped immediately, which is nearly
    // all of it once you have zoomed in. Panning got dramatically cheaper.
    LAND_PIECES = Object.values(d.shapes).map(ringsToPath)
                        .concat(d.other && d.other.length ? [ringsToPath(d.other)] : [])
                        .filter(Boolean);
    LAND_PATH = LAND_PIECES.join('');
    buildShapeIndex();
  }catch(err){
    console.warn('Heritle: detailed map unavailable, using the built-in outline —', err.message);
  }
}

async function loadDataset(){
  try{
    const res = await fetch('data/dataset.json', { cache: 'no-cache' });
    if(!res.ok) throw new Error(res.status);
    const data = await res.json();
    const entries = (data.entries || []).filter(e => e && e.id && typeof e.lat === 'number');
    if(entries.length < 3) throw new Error('too few entries');
    if(data.meta && data.meta.synthetic){
      console.warn('Heritle: this dataset.json is SYNTHETIC test data, not the real pipeline output.');
    }
    POOL = entries.map(e => normaliseEntry(e, data.countries || {}));
    COUNTRIES = buildCountries(data.countries || {});
    COUNTRY_NAMES = data.countries || {};
  }catch(err){
    // file://, missing pipeline output, or malformed JSON — play the demo set.
    console.warn('Heritle: falling back to the built-in demo set —', err.message);
    POOL = FALLBACK_DATA;
    COUNTRIES = [];
  }
  if(!COUNTRIES.length){
    // The demo set carries country names inline and no centroids; approximate
    // each country by the entries that sit in it so the game is still playable.
    const acc = new Map();
    POOL.forEach(d => {
      const key = d.country.en;
      const rec = acc.get(key) || { id:'demo-' + key, names:d.country, lat:0, lng:0, n:0 };
      rec.lat += d.lat; rec.lng += d.lng; rec.n++;
      acc.set(key, rec);
    });
    COUNTRIES = [...acc.values()].map(r => ({ id:r.id, names:r.names,
                                              lat:r.lat / r.n, lng:r.lng / r.n }));
  }
  computeTargets();
}

/* ---------- Storage generation ----------
   The pool changed under players' feet. Early archives were catalogued from a
   dataset that included tentative-list entries -- candidates, not inscribed
   heritage -- so a returning player's collection and passport describe things
   the game no longer contains and no longer awards. Carrying that forward
   would leave accession numbers nobody can re-earn and archive rows that lead
   nowhere, so a generation bump clears everything written before the change.
   Bumped again for the scoring rework: days are four rounds now, not three,
   and scored out of 150 rather than 100, so a stored day's score and status
   list mean something different from what they meant when they were written.

   And again at launch, when day one was moved to the opening date: every
   stored day is keyed by an index that now points at a different puzzle.

   Bump this only when stored data genuinely cannot be reconciled: it throws
   away real play. */
const STORAGE_GEN = '4';
const GEN_KEY = 'heritle-gen';
if(lsGet(GEN_KEY) !== STORAGE_GEN){
  try{
    Object.keys(localStorage)
      // The language preference is a UI setting, not game state: a reset of
      // the archives should not put a French player back into English.
      .filter(k => k.startsWith('heritle-') && k !== GEN_KEY && k !== LANG_KEY)
      .forEach(lsRemove);
  }catch(e){ /* no storage to enumerate means nothing was stored to clear */ }
  lsSet(GEN_KEY, STORAGE_GEN);
}

/* ---------- State ---------- */
/* A practice run is played in memory and never written down. That is what
   makes it a replay: reading the finished save back meant clicking Replay on a
   day you had played landed you on its results screen, with the board over on
   Today and no game in sight. Nothing to resume, so it starts again. */
const STORAGE_KEY = `heritle-${dayIndex}`;
let state = (isPractice ? null : lsJSON(STORAGE_KEY, null)) || {
  round: 0,
  guesses: ROUND_PLAN.map(()=>[]),
  roundStatus: ROUND_PLAN.map(()=>null),
  roundScore: ROUND_PLAN.map(()=>0)
};
// Shapes, not merely presence: a half-written or hand-edited blob can carry a
// number where an array belongs, and every render walks these.
if(!Array.isArray(state.guesses))     state.guesses = ROUND_PLAN.map(()=>[]);
if(!Array.isArray(state.roundStatus)) state.roundStatus = ROUND_PLAN.map(()=>null);
if(!Array.isArray(state.roundScore))  state.roundScore = ROUND_PLAN.map(()=>0);
state.guesses = state.guesses.map(g => Array.isArray(g) ? g : []);
state.roundScore = state.roundScore.map(v => Number.isFinite(v) ? v : 0);
if(!Number.isFinite(state.round) || state.round < 0) state.round = 0;
if(!Array.isArray(state.ids) || state.ids.some(id => typeof id !== 'string')){
  delete state.ids;                 // a bad freeze is re-dealt, not honoured
}
// A save written before the round count changed would be short by a round and
// index past the end of its own arrays. The generation bump below clears those,
// but pad defensively rather than trusting it.
while(state.guesses.length     < N_ROUNDS) state.guesses.push([]);
while(state.roundStatus.length < N_ROUNDS) state.roundStatus.push(null);
while(state.roundScore.length  < N_ROUNDS) state.roundScore.push(0);
function saveState(){
  if(isPractice) return;            // practice leaves no trace, by definition
  lsSet(STORAGE_KEY, JSON.stringify(state));
}

/* ---------- Profile ----------
   Everything that outlives a single day: the catalogue of entries the player
   has seen, one record per completed day for the passport, and which
   achievements have been earned. Kept in one key so a browser only carries a
   single blob, and read defensively because a returning player may have a
   profile written by an older version. Practice replays never write here. */
const PROFILE_KEY = 'heritle-profile';

function loadProfile(){
  let p = {};
  p = lsJSON(PROFILE_KEY, {});
  return {
    collection: p.collection && typeof p.collection === 'object' ? p.collection : {},
    days:       p.days && typeof p.days === 'object' ? p.days : {},
    achievements: Array.isArray(p.achievements) ? p.achievements : [],
    seenFieldNotes: !!p.seenFieldNotes,
    colorblind: !!p.colorblind,
    favourites: p.favourites && typeof p.favourites === 'object' ? p.favourites : {},
    // When each distinction was earned. A passport is a record of where you
    // have been and when; without the date the stamps are a set, not a story.
    // Earned before this existed means no date, which is shown as no date
    // rather than as a guess.
    achievementsAt: p.achievementsAt && typeof p.achievementsAt === 'object'
                    ? p.achievementsAt : {},
    // Quietly kept for the secret distinctions.
    langsUsed: p.langsUsed && typeof p.langsUsed === 'object' ? p.langsUsed : {},
    nightOwl: !!p.nightOwl,
    dizzy: !!p.dizzy
  };
}
let profile = loadProfile();
function saveProfile(){
  // Private mode or a full quota: the game still plays, it just won't remember.
  lsSet(PROFILE_KEY, JSON.stringify(profile));
}

/* ---------- Backup ----------
   The collection lives in one browser and nowhere else. That is the deal a
   game with no accounts makes, and it is a fair one -- but the failure mode is
   brutal: clear the site data, switch phones, or simply do not visit for a
   week or two on Safari, whose storage eviction does not care how long it took
   to collect, and a year of play is gone with nothing to show it ever existed.

   So: a code the player can keep. Ids rather than records, because everything
   else -- names, countries, photographs -- is in the dataset already and can
   be rebuilt from an id. That is the difference between a 30 KB code and a
   600 KB one, and 600 KB is not something anyone pastes into a message.

   Restoring merges rather than replaces: a code from an old phone should add
   to what is here, never quietly delete a week of play on the new one. */
const BACKUP_VERSION = 1;

function encodeBackup(obj){
  // btoa is bytes, not characters; the ids are slugs but a future field may
  // not be, and a mangled code is worse than a long one.
  return btoa(unescape(encodeURIComponent(JSON.stringify(obj))))
           .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function decodeBackup(code){
  const b64 = String(code).trim().replace(/-/g, '+').replace(/_/g, '/');
  return JSON.parse(decodeURIComponent(escape(atob(b64))));
}

function exportProfile(){
  return encodeBackup({
    v: BACKUP_VERSION,
    // [id, day first met, solved]
    c: Object.values(profile.collection)
             .map(r => [r.id, r.day | 0, r.solved ? 1 : 0]),
    // day -> [score, statuses joined, the four ids that were played]
    d: Object.keys(profile.days).reduce((acc, day) => {
         const r = profile.days[day];
         acc[day] = [Math.round(r.score || 0),
                     (r.statuses || []).map(x => x === 'solved' ? 's'
                                               : x === 'failed' ? 'f' : '-').join(''),
                     (r.ids || []).join(',')];
         return acc;
       }, {}),
    a: profile.achievements.slice(),
    f: Object.keys(profile.favourites),
    // The one-off facts a collection cannot be re-derived from: they are how
    // three of the distinctions are earned, and a backup that dropped them
    // silently un-earned a secret on the new phone.
    g: profile.gemFirstGuess ? 1 : 0,
    z: profile.dizzy ? 1 : 0,
    n: profile.nightOwl ? 1 : 0,
    l: Object.keys(profile.langsUsed)
  });
}

/* Returns what it managed to restore, so the player is told rather than
   reassured. */
function importProfile(code){
  let data;
  try{ data = decodeBackup(code); }catch(e){ return null; }
  if(!data || typeof data !== 'object' || !Array.isArray(data.c)) return null;
  let entries = 0, days = 0, lost = 0;
  for(const row of data.c){
    if(!Array.isArray(row) || typeof row[0] !== 'string') continue;
    const [id, day, solved] = row;
    if(profile.collection[id]) continue;
    const live = BY_ID && BY_ID.get(id);
    if(!live){ lost++; continue; }      // no longer in the dataset: nothing to show
    profile.collection[id] = {
      id: live.id, day: day | 0, solved: !!solved,
      names: live.names, country: live.country, category: live.category,
      type: live.type, year: live.year,
      image: live.image ? { url: live.image.url, path: live.image.path,
                            credit: live.image.credit, license: live.image.license } : null,
      continent: live.continentCode || contCodeOf(live),
      qid: live.qid, siteId: live.siteId, officialUrl: live.officialUrl,
      wiki: live.wiki
    };
    entries++;
  }
  const incoming = (data.d && typeof data.d === 'object') ? data.d : {};
  for(const day of Object.keys(incoming)){
    const row = incoming[day];
    if(!Array.isArray(row) || profile.days[day]) continue;
    profile.days[day] = {
      score: Number(row[0]) || 0,
      statuses: String(row[1] || '').split('').map(
        c => c === 's' ? 'solved' : c === 'f' ? 'failed' : null),
      ids: String(row[2] || '').split(',').filter(Boolean),
      at: 0
    };
    days++;
  }
  (Array.isArray(data.f) ? data.f : []).forEach(id => {
    if(!profile.favourites[id]) profile.favourites[id] = 1;
  });
  if(data.g) profile.gemFirstGuess = true;
  if(data.z) profile.dizzy = true;
  if(data.n) profile.nightOwl = true;
  (Array.isArray(data.l) ? data.l : []).forEach(l => {
    if(UI[l] && !profile.langsUsed[l]) profile.langsUsed[l] = 1;
  });
  // Distinctions are re-earned from what the collection now holds rather than
  // trusted from the code, so a hand-edited list cannot award anything.
  saveProfile();
  checkAchievements({ quiet: true });
  saveProfile();
  return { entries, days, lost };
}

function isFavourite(id){ return !!profile.favourites[id]; }
function toggleFavourite(id){
  if(profile.favourites[id]) delete profile.favourites[id];
  else profile.favourites[id] = Date.now();   // kept, so the shelf can be ordered
  saveProfile();
}

/* The live entry behind a catalogue record, when the dataset still has it.
   Preferred because it carries the description and every link field without
   the profile having to store a copy of them. */
function liveEntry(rec){
  return POOL.find(e => e.id === rec.id) || rec;
}

/* Museum-style accession number: HTL.<year>.<sequence within that year>. */
function accessionFor(entryId){
  const rec = profile.collection[entryId];
  if(!rec) return '';
  const year = new Date(EPOCH + rec.day * 86400000).getUTCFullYear();
  const sameYear = Object.values(profile.collection)
    .filter(r => new Date(EPOCH + r.day * 86400000).getUTCFullYear() === year)
    .sort((a,b) => (a.day - b.day) || String(a.id).localeCompare(String(b.id)));
  const n = sameYear.findIndex(r => r.id === entryId) + 1;
  return `HTL.${year}.${String(n).padStart(3,'0')}`;
}

function catalogue(entry, solved){
  if(isPractice) return;                       // replays don't fill the archive
  if(profile.collection[entry.id]) return;     // first encounter only
  profile.collection[entry.id] = {
    id: entry.id, day: dayIndex, solved: !!solved,
    names: entry.names,
    // country and category are {en,fr,es} on a normalised entry, not codes.
    country: entry.country, category: entry.category,
    type: entry.type, year: entry.year,
    image: entry.image ? { url: entry.image.url, path: entry.image.path,
                           credit: entry.image.credit, license: entry.image.license } : null,
    continent: entry.continentCode || contCodeOf(entry),
    // What the links are built from, so a catalogued entry stays readable even
    // if a later dataset no longer carries it. The description is not copied:
    // it is long, and it is read off the live entry when there is one.
    qid: entry.qid, siteId: entry.siteId, officialUrl: entry.officialUrl,
    wiki: entry.wiki
  };
  saveProfile();
}

function recordDay(){
  if(isPractice) return;
  // Finished in the small hours, by the player's own clock.
  const hour = new Date().getHours();
  if(hour >= 0 && hour < 5) profile.nightOwl = true;
  profile.days[dayIndex] = {
    score: totalScore(),
    statuses: state.roundStatus.slice(),
    // What was actually played, so the archive can replay this day as it was
    // however much the dataset moves afterwards.
    ids: (targets || []).map(e => e.id),
    at: Date.now()
  };
  saveProfile();
  // Anything that fell out of finishing this day says so, rather than waiting
  // to be noticed in the passport. checkAchievements announces it.
  checkAchievements();
}

/* Current and best run of consecutive days played. */
function streaks(){
  const days = Object.keys(profile.days).map(Number).sort((a,b)=>a-b);
  let best = 0, run = 0, prev = null;
  days.forEach(d => { run = (prev !== null && d === prev + 1) ? run + 1 : 1;
                      best = Math.max(best, run); prev = d; });
  // The current streak only counts if it reaches today or yesterday.
  let current = 0;
  if(days.length){
    const last = days[days.length-1];
    if(last === todayIndex || last === todayIndex - 1){
      current = 1;
      for(let i = days.length - 2; i >= 0; i--){
        if(days[i] === days[i+1] - 1) current++; else break;
      }
    }
  }
  return { played: days.length, current, best };
}

/* ---------- Achievements ----------
   Tied to what the player has actually seen of the world's heritage rather
   than to how often they open the page. Deliberately few. */
const ARCHIVIST_TIERS = [5, 10, 25, 50, 100, 250, 365, 500, 750, 1000];

/* How many entries from a continent make "discovering" it true. Not one
   number: the pool holds 712 European entries and 31 from Oceania, so a flat
   threshold would be a formality in one place and unreachable in another.
   These are roughly two months of play each, given how often a continent comes
   up in the draw. */
const CONTINENT_GOALS = { EU:15, AS:15, AF:8, NA:6, SA:6, OC:3 };

const collectionSize = ()=> Object.keys(profile.collection).length;
const catalogued = ()=> Object.values(profile.collection);
const daysPlayed = ()=> Object.values(profile.days);

/* Each distinction carries the mark that goes in its stamp -- short, because a
   stamp is small, and text rather than a symbol so it centres and renders the
   same everywhere. */
/* Not all of these are worth the same, and the passport used to show them as
   if they were: forty entries catalogued sat in the same frame as a month
   without missing a day. Three ranks -- and a fourth that is not a rank at
   all, for the ones nobody is told about. */
const RANK = { common: 'common', rare: 'rare', prestige: 'prestige' };

const ACHIEVEMENTS = [
  { id:'continents', mark:'360', rank:RANK.prestige, test:()=> {
      const seen = new Set(catalogued().map(r=>r.continent).filter(Boolean));
      return ['EU','AS','AF','NA','SA','OC'].every(c=>seen.has(c));
    } },
  { id:'perfect',   mark:'MAX', rank:RANK.prestige,
    test:()=> daysPlayed().some(d=>d.score >= MAX_SCORE) },
  { id:'hiddengem', mark:'1st', rank:RANK.rare, test:()=> !!profile.gemFirstGuess },
  { id:'flawless',  mark:'4/4', rank:RANK.prestige, test:()=> daysPlayed().some(d =>
      d.statuses && d.statuses.length === N_ROUNDS && d.statuses.every(x=>x==='solved')) },
  // The collection ladder. Tiered because a single badge at twenty-five meant
  // nothing happened for six days and then never again; named rather than
  // numbered because "Archivist IV" is a row in a table, not a reward.
  ...ARCHIVIST_TIERS.map(n => ({
    // '1K' rather than '1000': four digits do not fit a stamp legibly.
    id: 'coll' + n, tier: n, mark: n >= 1000 ? (n / 1000) + 'K' : String(n),
    // The ladder earns its rank: the first rungs are a week of play, the last
    // is the better part of a year.
    rank: n >= 500 ? RANK.prestige : n >= 100 ? RANK.rare : RANK.common,
    test: () => collectionSize() >= n
  })),
  // A continent at a time, which is the shape the collection actually grows in.
  ...Object.entries(CONTINENT_GOALS).map(([code, goal]) => ({
    id: 'cont' + code, cont: code, goal, mark: code, rank: RANK.rare,
    test: () => catalogued().filter(r => r.continent === code).length >= goal
  })),
  { id:'trad10', mark:'X', rank:RANK.common, test:()=>
      catalogued().filter(r => r.type === 'immaterial').length >= 10 },
  { id:'trad50', mark:'L', rank:RANK.rare, test:()=>
      catalogued().filter(r => r.type === 'immaterial').length >= 50 },
  { id:'streak7',  mark:'7',  rank:RANK.rare,     test:()=> streaks().best >= 7 },
  { id:'streak30', mark:'30', rank:RANK.prestige, test:()=> streaks().best >= 30 },
  // Inscription decades, so a collection spread across the register's whole
  // history is worth something a pile of famous cathedrals is not.
  { id:'decades', mark:'50s', rank:RANK.prestige, test:()=>
      new Set(catalogued().map(r => r.year).filter(Boolean)
                          .map(y => Math.floor(y / 10))).size >= 5 },
  { id:'bonus10', mark:'B', rank:RANK.rare, test:()=>
      daysPlayed().filter(d => d.statuses && d.statuses[3] === 'solved').length >= 10 },
  // Hidden: not listed among what is left to find, because a secret you can
  // read off a list is not one. Earned by spinning the little person a hundred
  // turns without letting him stop.
  { id:'dizzy', mark:'∞', secret:true, test:()=> !!profile.dizzy },
  // Read in all three languages. The game is trilingual because the lists are;
  // somebody who goes looking in each of them should be noticed.
  { id:'polyglot', mark:'III', secret:true, test:()=>
      ['en','fr','es'].every(l => !!profile.langsUsed[l]) },
  // Finished a day between midnight and five, by the player's own clock.
  { id:'nightowl', mark:'02', secret:true, test:()=> !!profile.nightOwl }
];

/* What the passport shows: everything except secrets nobody has earned yet. */
function visibleAchievements(){
  return ACHIEVEMENTS.filter(a => !a.secret || profile.achievements.includes(a.id));
}

/* The name and description for a distinction, in the player's language. */
function achText(a){
  const T = t();
  if(a.tier) return T.ach.coll[a.tier];
  if(a.cont) return T.ach.cont(UI[lang].continents[a.cont] || a.cont, a.goal);
  return T.ach[a.id];
}

/* A passport stamp, drawn rather than set in type: a glyph in a bordered span
   sat wherever its font's metrics put it, which on most of them was not the
   middle. Text is centred on the geometry here, and the earned ones are turned
   a few degrees, the way a stamp lands. */
function stampSvg(mark, earned){
  const size = mark.length > 2 ? 10 : (mark.length > 1 ? 13 : 16);
  return `<svg class="stamp-mark${earned ? ' earned' : ''}" viewBox="0 0 48 48"
               aria-hidden="true" focusable="false">
    <circle class="ring outer" cx="24" cy="24" r="21.5"/>
    <circle class="ring inner" cx="24" cy="24" r="16.5"/>
    <text class="stamp-text" x="24" y="24" dy="0.35em"
          style="font-size:${size}px">${mark}</text>
  </svg>`;
}

function checkAchievements(opts){
  if(isPractice) return [];
  const fresh = [];
  ACHIEVEMENTS.forEach(a=>{
    if(!profile.achievements.includes(a.id) && a.test()){
      profile.achievements.push(a.id);
      profile.achievementsAt[a.id] = Date.now();
      fresh.push(a.id);
    }
  });
  if(fresh.length){
    saveProfile();
    // Winning something should be an event, not a number that quietly moves
    // in a list nobody has open. Restoring a backup is the exception: it can
    // re-earn twenty at once, and twenty announcements is a punishment.
    if(!(opts && opts.quiet)) announce(fresh);
  }
  return fresh;
}

/* ---------- Saying so ----------
   One card at a time, queued, because several can land together -- finishing
   a day can complete the collection ladder and a streak in the same instant.
   Drawn in the rank's own colours, so what arrives looks like what was won. */
const announceQueue = [];
let announcing = false;

function announce(ids){
  (Array.isArray(ids) ? ids : [ids]).forEach(id => {
    if(!announceQueue.includes(id)) announceQueue.push(id);
  });
  if(!announcing) nextAnnouncement();
}

function nextAnnouncement(){
  const id = announceQueue.shift();
  if(!id){ announcing = false; return; }
  announcing = true;
  const T = t();
  const a = ACHIEVEMENTS.find(x => x.id === id);
  // Through achText, not T.ach[id]: the collection ladder and the continents
  // are named by tier and by continent rather than by id, so reading them
  // straight off the table silently skipped every one of them -- which is to
  // say, most of the distinctions in the game.
  const said = a ? achText(a) : null;
  if(!a || !said){ nextAnnouncement(); return; }
  const kind = achClass(a);
  const el = document.createElement('div');
  el.className = `award-card r-${kind}`;
  el.setAttribute('role', 'status');
  el.innerHTML =
    `<span class="award-kind">${a.secret ? T.secretFound : T.awardWon}</span>
     ${stampSvg(a.mark, true)}
     <b>${said[0]}</b><span class="award-desc">${said[1]}</span>
     <span class="award-rank">${T.rankNames[kind]}</span>`;
  document.body.appendChild(el);
  // Long enough to read the name and the reason, short enough not to sit in
  // front of the board.
  const hold = setTimeout(()=> close(), 3600);
  function close(){
    clearTimeout(hold);
    el.classList.add('go');
    setTimeout(()=>{ el.remove(); nextAnnouncement(); }, 420);
  }
  el.addEventListener('click', close);
}

/* The date a distinction was earned, as the player's own calendar had it.
   Anything earned before the dates were kept has none, and says so. */
function earnedOn(id){
  const at = profile.achievementsAt && profile.achievementsAt[id];
  if(!at) return '';
  const d = new Date(at);

/* ---------- Colour-blind support ----------
   The heat scale is hue-only, which is exactly the cue that fails for the most
   common forms of colour blindness. The toggle layers a distinct glyph onto
   every distance bucket so the reading never depends on hue. */
const heatGlyph = { correct:'●', hot:'▲', close:'◆', mid:'■', far:'○' };
function cbOn(){ return !!profile.colorblind; }
function applyColorblind(){
  document.body.classList.toggle('cb', cbOn());
}

/* ---------- Geo math ---------- */
function haversineKm(lat1,lng1,lat2,lng2){
  const R=6371, toRad=x=>x*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLng=toRad(lng2-lng1);
  const a=Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function bearing(lat1,lng1,lat2,lng2){
  const toRad=x=>x*Math.PI/180;
  const y=Math.sin(toRad(lng2-lng1))*Math.cos(toRad(lat2));
  const x=Math.cos(toRad(lat1))*Math.sin(toRad(lat2)) - Math.sin(toRad(lat1))*Math.cos(toRad(lat2))*Math.cos(toRad(lng2-lng1));
  return (Math.atan2(y,x)*180/Math.PI + 360) % 360;
}
function heatBucket(km){
  if(km < 40) return 'correct';
  if(km < 1000) return 'hot';
  if(km < 3000) return 'close';
  if(km < 6500) return 'mid';
  return 'far';
}
const heatColorVar = { pending:'var(--gold)', correct:'var(--correct)', hot:'var(--heat-hot)', close:'var(--heat-close)', mid:'var(--heat-mid)', far:'var(--heat-far)' };
const heatEmoji = { correct:'✅', hot:'🟥', close:'🟧', mid:'🟨', far:'🟦' };
const compassDirs = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
function dirLabel(deg){ return compassDirs[Math.round(deg/22.5) % 16]; }
/* ---------- Scoring ----------
   Distance-based rather than all-or-nothing: naming the right country takes
   the round's full points, and anything else is worth what its proximity
   earns. 2000 km is the half-life-ish scale -- a neighbouring country keeps
   most of the points, the wrong continent keeps almost none.

   A round ends the moment full points are earned. Otherwise it runs its full
   allowance and the LAST guess is the one that scores: the earlier ones buy
   information, not points, so a third guess is a commitment rather than a
   free extra try. */
/* ---------- What a round is worth ----------
   Solving used to be flat: any guess inside the allowance took full marks. So
   the day's total collapsed onto eight values -- 117 is nothing more than two
   sites and the bonus, which is why it comes up again and again, and why two
   players who deduced it in one guess and stumbled into it in three scored
   the same.

   Now the credit decays with each try, so the score says how well it went and
   not merely whether it went. A missed round is scored on its *best* guess
   rather than its last, by geography and cultural affinity together: for a
   tradition shared across a region, "the right part of the world" is the real
   signal and kilometres are not, and a player who narrowed it to the right
   region should not be punished for spending the last try on a long shot.
   Missing is capped below the worst possible solve, so finding it always beats
   not finding it. */
/* Free placement: a guess is a point, not a country off a list. Which means
   "right" needs a definition, and this is it -- inside one of the inscribing
   countries, or within a hundred kilometres of the site itself. The second
   half matters for the cases the first half gets wrong: a site two valleys
   over the border, an island whose polygon the map does not carry, a tradition
   whose country is enormous. A hundred kilometres is close enough that the
   player has genuinely found the place. */
const NEAR_KM = 100;

const SCORE_SCALE_KM = 2000;
const SOLVE_CREDIT = [1, 0.85, 0.72, 0.6];   // by the guess it was solved on
const MISS_CEILING = 0.45;                   // under the worst solve, 0.6
const REGION_FLOOR = 0.55, CONTINENT_FLOOR = 0.3;

function solveCredit(n){
  const i = Math.min(Math.max(1, n), SOLVE_CREDIT.length) - 1;
  return SOLVE_CREDIT[i];
}
/* How near a single guess came: the better of how close it landed and how
   near it was culturally. */
function closeness(g){
  const geo = Math.exp(-g.km / SCORE_SCALE_KM);
  const cultural = g.regionOk ? REGION_FLOOR : (g.contOk ? CONTINENT_FLOOR : 0);
  return Math.max(geo, cultural);
}
function missCredit(guesses){
  return MISS_CEILING * guesses.reduce((best, g) => Math.max(best, closeness(g)), 0);
}
