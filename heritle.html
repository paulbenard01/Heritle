<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
/* Plain http and https are different origins, and localStorage belongs to an
   origin. So http://heritle.org is not a shabbier version of the site -- it is
   a different box with a different collection in it, and anyone arriving from
   a link in an Instagram bio (which is http://) found an empty passport and no
   streak. GitHub Pages will do this redirect itself once Enforce HTTPS is on;
   this does not wait for that, and keeps working if it is ever turned off.

   Before anything else on the page, so the wrong origin never gets as far as
   writing to its own storage. */
(function(){
  var h = location.hostname;
  if(location.protocol === 'http:' &&
     h !== 'localhost' && h !== '' && !/^127\.|^\[?::1\]?$|^192\.168\./.test(h)){
    location.replace('https://' + location.host + location.pathname
                     + location.search + location.hash);
  }
})();
</script>
<title>Heritle</title>
<!-- One file that changes its own colour, rather than two the browser picks
     between. Two <link rel="icon" media="..."> entries is the documented way
     and it is not reliable -- browsers differ on which candidate they take,
     and some ignore the media attribute entirely, which is how a black mark
     ended up in a dark tab strip. An SVG favicon is a document, so it carries
     its own stylesheet; see tools/make_favicon.py. -->
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="apple-touch-icon" href="assets/vectorised-4c7d2e03.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#131D34; --navy-2:#1B2A4A; --navy-3:#233A63;
    --cream:#F3EEDF; --ink:#E7E1CF; --ink-dim:#9CA6C0;
    --gold:#C9A24B; --gold-dim:#8E7333;
    --heat-far:#3E5C86; --heat-mid:#8C6A46; --heat-close:#B8532E; --heat-hot:#8E2F1D; --correct:#5C8A5C;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; min-height:100dvh; background:var(--navy); color:var(--ink);
    font-family:'Inter',sans-serif; display:flex; justify-content:center;
    /* dvh so the iOS URL bar can't add phantom height; env() keeps content
       clear of the notch and home indicator, which matters in landscape. */
    padding:28px 14px 64px;
    padding-left:max(14px, env(safe-area-inset-left));
    padding-right:max(14px, env(safe-area-inset-right));
    padding-bottom:max(64px, calc(env(safe-area-inset-bottom) + 40px));
    -webkit-tap-highlight-color:rgba(201,162,75,0.25);
  }
  button{touch-action:manipulation;}
  .page{width:100%;max-width:480px;}

  /* ---------- Wide screens ----------
     The whole game was 480px wide on every display, so a laptop showed a
     narrow strip of board in the middle of an otherwise empty navy field --
     and the map, which is the input device in a map-guessing game, was a
     third of the width it could have been. Above 980px the photograph and the
     map sit side by side instead: the two things a round is actually made of,
     both larger, and the guess is next to the evidence rather than under it.
     Everything below them stays in one column, because a clue list and a
     history are read, not aimed at. */
  @media (min-width: 980px){
    .page{max-width:1060px;}
    #viewGame{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);
      column-gap:22px;align-items:start;}
    /* Every row is placed by hand, and that is not fussiness: naming a row for
       the photograph and the map while leaving the pips and the badges to
       auto-placement put them *after* the board, because auto-placement fills
       the first free row and rows 1 and 2 were spoken for. On the live site
       the round pips and the score sat under the map, below the fold. */
    #viewGame > .rounds-row{grid-column:1 / -1;grid-row:1;}
    #viewGame > .meta-row{grid-column:1 / -1;grid-row:2;}
    #viewGame > .photo-box{grid-column:1;grid-row:3;margin-bottom:0;}
    #viewGame > .map-wrap{grid-column:2;grid-row:3;margin-bottom:0;}
    #viewGame > .clues, #viewGame > .history,
    #viewGame > .round-result, #viewGame > .final-result,
    #viewGame > #guessCounter, #viewGame > .countdown{grid-column:1 / -1;}
    /* The prompt to tap belongs under the thing being tapped, not under the
       photograph on the other side of the board. */
    #viewGame > .guess-row{grid-column:2;grid-row:4;align-self:start;margin-top:12px;}
    /* A 16:9 photograph beside a 2:1 map: without this the taller of the two
       stretches its column and the pair stop lining up at the top. */
    #viewGame > .photo-box img{max-height:430px;object-fit:cover;}
    /* Four clue cards across rather than two: at this width two of them leave
       a line of text in a box the size of a postcard. Written with the id so
       it beats the base rule further down the sheet. */
    #viewGame > .clues{grid-template-columns:repeat(4, minmax(0,1fr));}
    .view.active{padding-bottom:30px;}
  }
  /* Wider still: the column stops growing, because a photograph three feet
     across is not a better puzzle and the text lines become unreadable. */
  @media (min-width: 1400px){ .page{max-width:1180px;} }
  header{text-align:center;margin-bottom:16px;position:relative;}
  /* The mark sits opposite the language control, and costs nothing in the
     vertical budget above the photograph. */
  /* The mark is a door into everything that is not the puzzle -- who made it,
     where to read further, the project itself -- and at 52px in a corner it
     read as decoration. It is bigger on a screen with room for it, it is ringed
     so it reads as something to press, and it says what it is underneath. */
  .mark{position:absolute;top:-4px;left:0;width:52px;height:52px;padding:0;
    background:none;border:none;cursor:pointer;line-height:0;
    border-radius:50%;
    transition:box-shadow 0.18s ease, transform 0.18s ease;
    display:flex;align-items:center;justify-content:center;
    -webkit-tap-highlight-color:transparent;
    /* Held down for ten seconds at a time, so none of the things a long press
       normally does -- select the image, offer to save it, start a drag -- may
       happen. */
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
    touch-action:none;}
  /* A whole number of pixels, and object-fit rather than height:auto. The
     artwork is 673.6 x 656.4, so height:auto gave the box a fractional height
     (42 x 40.92) -- and a fractionally sized box is re-rasterised as it turns,
     which is what made the spin swell by a pixel and settle back. contain
     keeps the aspect ratio without squashing it into the square. */
  .mark:hover{transform:scale(1.04);}
  .mark:hover, .mark[aria-expanded="true"]{
    box-shadow:0 0 0 2px rgba(201,162,75,0.45), 0 6px 22px rgba(201,162,75,0.18);}
  .mark:focus-visible{outline:2px solid var(--gold);outline-offset:3px;}
  .mark img{width:48px;height:48px;object-fit:contain;display:block;
    pointer-events:none;user-select:none;-webkit-user-drag:none;
    /* Promoted to its own layer up front. If the layer were created when the
       animation starts, the mark would be rasterised afresh at that moment --
       a visible jump at each end of the spin. */
    transform:translateZ(0);backface-visibility:hidden;}
  .mark:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:50%;}
  /* Spin on a tap. The class is removed when the animation ends, so it can be
     set off again -- an animation that only plays once is a disappointment. */
  /* The spin is driven frame by frame in script now, not by a keyframe: a top
     that winds up while you hold it and coasts to a stop has no fixed
     duration, and it has to keep whatever angle it lands on. The layer is
     already promoted above; transform-origin and will-change are all the CSS
     it needs. */
  .mark img{transform-origin:50% 50%;}
  .mark.spinning img{will-change:transform;}
  @media (prefers-reduced-motion: reduce){ .mark.spin img{animation:none;} }

  /* ---------- Where the mark sits, and why the ring fits it ----------
     Measured off the artwork: in a 200px box the gold disc spans 170px and is
     centred at (95.5, 93), not (100, 100) -- the vectorisation carries its own
     asymmetric padding. A ring drawn on the button could therefore never be
     concentric with the disc, which is what "not centred at all" was. The
     picture is scaled until the disc fills the button (200/170) and nudged
     back to the middle, so the ring hugs the disc rather than the file.

     Written after the base rule rather than before it: same specificity, and
     source order is what decides. That is how a 76px button ended up with a
     48px picture inside it. */
  .mark{overflow:hidden;}            /* the scaled corners are transparent */
  .mark > img{transform:translate(2.65%, 4.1%) scale(1.176);}
  @media (min-width: 980px){
    /* Two thirds up from the phone's 52. Compared side by side at 76, 86, 96
       and 132: 132 stood taller than the title and the two lines under it put
       together, and 76 reads small again now that the picture actually fills
       the button. 86 sits as a peer of the wordmark, which is what it is. */
    .mark{width:86px;height:86px;top:-6px;}
    .mark > img{width:86px;height:86px;}
  }

  /* The menu the mark opens. Anchored under it, left-aligned with it, and
     above the dimmer so it stays lit while the page behind it goes quiet. */
  .mark-menu{position:absolute;top:54px;left:0;z-index:12;min-width:214px;
    max-width:min(320px, calc(100vw - 32px));
    background:var(--navy-2);border:1px solid var(--gold-dim);border-radius:11px;
    padding:7px;text-align:left;
    box-shadow:0 18px 40px rgba(5,8,18,0.55);
    animation:menu-drop 0.19s cubic-bezier(0.2,0.7,0.3,1);transform-origin:12px 0;}
  /* Drops out from under the mark rather than appearing. The animation runs on
     becoming displayed, which is why open and close are asymmetric: opening is
     the moment worth animating. */
  @keyframes menu-drop{
    from{ opacity:0; transform:translateY(-10px) scale(0.97); }
    to  { opacity:1; transform:translateY(0) scale(1); } }
  @media (prefers-reduced-motion: reduce){ .mark-menu{animation:none;} }
  .mark-menu a, .mark-menu button{display:flex;width:100%;align-items:center;
    justify-content:space-between;gap:10px;padding:12px 13px;min-height:46px;
    border-radius:8px;background:none;border:none;cursor:pointer;text-align:left;
    font-family:'JetBrains Mono',monospace;font-size:0.72rem;letter-spacing:0.03em;
    color:var(--ink);text-decoration:none;}
  .mark-menu a:hover, .mark-menu button:hover{background:rgba(201,162,75,0.12);
    color:var(--gold);}
  /* Two halves: the registers to read, then the game itself. Without the
     headings seven links read as one undifferentiated list, with the primary
     sources sitting level with an Instagram handle. */
  .mark-menu .menu-head{display:block;padding:9px 12px 3px;
    font-family:'JetBrains Mono',monospace;font-size:0.57rem;letter-spacing:0.13em;
    text-transform:uppercase;color:var(--gold-dim);}
  /* A list this long has to be able to run out of room gracefully: on a short
     screen it scrolls rather than disappearing off the bottom. */
  .mark-menu{max-height:calc(100vh - 86px);overflow-y:auto;}
  .mark-menu a, .mark-menu button{line-height:1.25;}
  .mark-menu a span, .mark-menu button span{color:var(--gold-dim);}
  /* The one item that stays inside the game gets a rule under it -- and the
     little person sits at the end of that row, where a person belongs. */
  .mark-menu .menu-inside{display:flex;align-items:center;gap:8px;
    border-bottom:1px dashed rgba(201,162,75,0.22);
    border-radius:8px 8px 0 0;margin-bottom:3px;padding-right:6px;}
  .mark-menu .menu-about{flex:1 1 auto;min-width:0;justify-content:flex-start;}
  /* Written against .mark-menu, or the sheet's own `.mark-menu button`
     rule -- display:flex, width:100%, min-height:46px -- wins on specificity
     and the little person takes the whole row, squeezing Who am I into three
     lines beside him. */
  .mark-menu .menu-figure{flex:none;width:44px;min-width:44px;height:44px;
    min-height:44px;padding:0;border:none;position:relative;
    background:none;cursor:pointer;line-height:0;display:flex;
    align-items:center;justify-content:center;
    /* Held for ten seconds at a time, so none of the things a long press
       normally does -- select, offer to save, start a drag -- may happen. */
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
    touch-action:none;-webkit-tap-highlight-color:transparent;}
  .mark-menu .menu-figure img{width:34px;height:34px;object-fit:contain;
    transform-origin:50% 50%;transform:translateZ(0);pointer-events:none;}
  .mark-menu .menu-figure.spinning img{will-change:transform;}
  /* Ten seconds of holding with nothing to show for it reads as a broken
     button -- which is exactly what it was reported as. Past a few turns he
     starts counting them out loud, so the hold is visibly getting somewhere.
     It gives the secret away no more than the spinning already does. */
  .mark-menu .menu-figure .spin-turns{position:absolute;right:100%;top:50%;
    transform:translateY(-50%);margin-right:8px;
    font-family:'JetBrains Mono',monospace;
    font-size:0.58rem;color:var(--gold);letter-spacing:0.04em;
    white-space:nowrap;pointer-events:none;opacity:0;
    transition:opacity 0.25s ease;}
  .mark-menu .menu-figure .spin-turns.on{opacity:0.9;}
  /* The marks a couple of the links carry. */
  .mark-menu .menu-label{display:flex;align-items:center;gap:9px;min-width:0;}
  .menu-icon{width:15px;height:15px;object-fit:contain;flex:none;opacity:0.85;}
  .mark-menu a:hover .menu-icon{opacity:1;}
  /* Instagram beside the language picker: videos are going up there, and a
     link nobody finds is not a link. */
  .lang-ig{display:inline-flex;align-items:center;padding:4px 2px 4px 8px;
    opacity:0.6;}
  .lang-ig:hover{opacity:1;}
  .lang-ig img{width:15px;height:15px;display:block;}
  .mark-menu:empty{display:none;}
  /* After the base rule, not before it: `.mark-menu{top:54px}` below would
     otherwise win on source order and the menu would open over the mark --
     measured at 28px of overlap. */
  @media (min-width: 980px){ .mark-menu{top:92px;} }

  .mark-dim{position:fixed;inset:0;z-index:10;background:rgba(8,12,24,0.62);
    animation:dim-in 0.19s ease-out;}
  @keyframes dim-in{ from{ opacity:0; } to{ opacity:1; } }
  @media (prefers-reduced-motion: reduce){ .mark-dim{animation:none;} }
  /* The mark itself has to stay above the dimmer, or it darkens as it spins. */
  .mark{z-index:11;}
  /* Only this line has to keep clear of the mark and the language control.
     Padding the whole header pushed the pitch onto two lines on a phone, which
     is the vertical budget above the photograph going backwards. */
  .wordmark{display:block;font-family:'Playfair Display',serif;font-weight:700;
    font-size:2.4rem;color:var(--cream);padding:0 58px;
    text-decoration:none;transition:color 0.15s ease;}
  .wordmark:hover{color:var(--gold);}
  .wordmark:focus-visible{outline:2px solid var(--gold);outline-offset:4px;
    border-radius:6px;}
  /* The language control grew an Instagram mark, and on a narrow phone the
     title ran straight into it: measured, the wordmark overlapped the picker
     by 29px at 320 and 9px at 360. The title gives way rather than the link,
     because the title is also written across the top of the page in words. */
  @media (max-width:430px){
    .wordmark{font-size:2rem;padding:0 74px 0 56px;}
  }
  @media (max-width:360px){
    .wordmark{font-size:1.6rem;padding:0 86px 0 54px;}
  }
  .pitch{color:var(--cream);font-size:0.95rem;margin-top:10px;}
  .tagline{color:var(--ink-dim);font-size:0.8rem;margin-top:4px;}
  @media (max-width:560px){
    /* More air here than anywhere, because the header is three things across
       one line above it and the pitch was sitting on the title's serifs. */
    .pitch{margin-top:14px;line-height:1.35;}
    .tagline{margin-top:5px;}
  }
  /* Demoted deliberately. Gold is the palette's "act on this" colour -- the
     guess button, the live round, the confirm bar -- and spending it on a
     setting most players touch once put a preference above the puzzle in the
     visual order. It is now quiet type, and absolutely positioned so it costs
     nothing in the vertical budget above the photograph. */
  .lang-slider{position:absolute;top:0;right:0;display:inline-flex;}
  .lang-btn{background:transparent;border:none;color:var(--ink-dim);
    font-family:'JetBrains Mono',monospace;font-size:0.68rem;letter-spacing:0.03em;
    padding:4px 6px;cursor:pointer;opacity:0.65;}
  .lang-btn.active{color:var(--cream);opacity:1;text-decoration:underline;
    text-underline-offset:3px;text-decoration-color:var(--gold-dim);}

  .rounds-row{display:flex;justify-content:center;gap:8px;margin:16px 0 10px;}
  .round-pip{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-family:'JetBrains Mono',monospace;font-size:0.75rem;border:1px solid var(--gold-dim);color:var(--ink-dim);}
  .round-pip.current{border-color:var(--gold);color:var(--cream);}
  .round-pip.done-solved{background:var(--correct);border-color:var(--correct);color:var(--navy);}
  .round-pip.done-failed{background:var(--heat-hot);border-color:var(--heat-hot);color:var(--cream);}
  /* The bonus round is a different kind of thing, not a fourth site: dashed
     until played, so the row reads as three-plus-one. Placed after the state
     rules above so a played bonus pip still shows its result colour. */
  .round-pip.bonus{border-style:dashed;color:var(--gold);}
  .round-pip.bonus.done-solved, .round-pip.bonus.done-failed{border-style:solid;}
  .round-pip.bonus.done-solved{color:var(--navy);}

  .counter-note{margin-top:4px;font-size:0.66rem;color:var(--ink-dim);opacity:0.8;}

  .meta-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;
    font-family:'JetBrains Mono',monospace;font-size:0.7rem;color:var(--ink-dim);}
  /* A label saying which pool today's round came from. It answers a question
     nobody asked mid-guess, so it reads as caption, not as a control. */
  .mode-badge{border-radius:4px;padding:3px 0;color:var(--ink-dim);
    letter-spacing:0.06em;}
  /* The badges are emptied rather than removed when a screen does not want
     them, and an empty bordered pill still draws a small box. */
  .mode-badge:empty{border:none;padding:0;}
  .score-badge{color:var(--cream);}

  .photo-box{
    position:relative;width:100%;aspect-ratio:16/10;border-radius:10px;overflow:hidden;
    border:1px solid rgba(201,162,75,0.25);margin-bottom:14px;background:var(--navy-2);
  }
  .photo-box img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-fallback{
    display:none;position:absolute;inset:0;flex-direction:column;align-items:center;justify-content:center;
    gap:6px;color:var(--ink-dim);font-size:0.78rem;text-align:center;padding:0 20px;
  }
  .photo-fallback svg{width:34px;height:34px;opacity:0.5;}
  .photo-credit{position:absolute;bottom:4px;right:8px;font-size:0.6rem;color:rgba(243,238,223,0.55);
    font-family:'JetBrains Mono',monospace;}
  /* The board crops to 16:10, which hides most of the frame. Tapping opens the
     whole photo so the player can read the detail they're guessing from. */
  .photo-box.zoomable{cursor:zoom-in;}
  .share-note{font-size:0.72rem;color:var(--ink-dim);margin:8px 0 0;}
  .cb-note{font-size:0.72rem;color:var(--ink-dim);line-height:1.5;margin:6px 0 0;}

  /* One row per place to go, all the same width and weight. As wrapped pills
     of different lengths they read as leftovers; the point of this panel is
     that somebody leaves it knowing more, so the ways out are the furniture,
     not the afterthought. */
  .modal-links{display:flex;flex-direction:column;gap:7px;margin-top:9px;}
  .learn-link{display:flex;align-items:center;gap:10px;width:100%;
    padding:11px 13px;border:1px solid var(--gold-dim);border-radius:8px;
    color:var(--gold);text-decoration:none;font-size:0.8rem;min-height:46px;
    background:rgba(201,162,75,0.04);box-sizing:border-box;}
  .learn-link:hover{background:rgba(201,162,75,0.12);}
  .learn-link .ll-mark{font-family:'JetBrains Mono',monospace;font-size:0.62rem;
    color:var(--gold-dim);border:1px solid rgba(201,162,75,0.35);border-radius:5px;
    width:26px;height:26px;flex:none;display:flex;align-items:center;
    justify-content:center;line-height:1;}
  .learn-link .ll-text{flex:1;min-width:0;line-height:1.3;}
  .learn-link .ll-go{color:var(--gold-dim);flex:none;font-size:0.85rem;}

  .photo-nav{position:absolute;top:6px;left:8px;display:flex;align-items:center;gap:2px;
    background:rgba(19,29,52,0.72);border-radius:4px;}
  .photo-nav[hidden]{display:none;}
  /* Half the height of the picture, down each edge, and wide enough to hit
     without aiming. They stop the click reaching the picture underneath. */
  .photo-step{position:absolute;top:50%;transform:translateY(-50%);
    width:46px;height:58%;min-height:70px;display:flex;align-items:center;
    justify-content:center;z-index:3;cursor:pointer;
    background:linear-gradient(90deg, rgba(10,14,26,0.55), rgba(10,14,26,0));
    border:none;color:var(--cream);font-size:1.9rem;line-height:1;
    padding:0 0 4px;opacity:0.8;transition:opacity 0.15s ease;
    border-radius:0 10px 10px 0;}
  .photo-step.next{right:0;border-radius:10px 0 0 10px;
    background:linear-gradient(270deg, rgba(10,14,26,0.55), rgba(10,14,26,0));}
  .photo-step.prev{left:0;}
  .photo-step:hover{opacity:1;}
  .photo-step[hidden]{display:none;}
  .photo-step:disabled{opacity:0.18;cursor:default;}
  @media (min-width: 980px){ .photo-step{width:58px;font-size:2.3rem;} }
  .photo-nav button{background:none;border:none;color:var(--ink-dim);cursor:pointer;
    font-size:0.9rem;line-height:1;padding:4px 7px;min-height:30px;}
  .photo-nav button:disabled{opacity:0.25;cursor:default;}
  .photo-count{font-family:'JetBrains Mono',monospace;font-size:0.62rem;
    color:var(--ink-dim);padding:2px 2px;}
  /* Gold only on the guess that just revealed one, so a new photograph
     announces itself without the badge shouting for the rest of the round. */
  .photo-count.fresh{color:var(--gold);}
  .zoom-hint{position:absolute;top:6px;right:8px;width:26px;height:26px;border-radius:50%;
    background:rgba(19,29,52,0.7);border:1px solid var(--gold-dim);display:none;
    align-items:center;justify-content:center;pointer-events:none;}
  .photo-box.zoomable .zoom-hint{display:flex;}
  .zoom-hint svg{width:14px;height:14px;stroke:var(--gold);fill:none;stroke-width:2;}
  .lightbox{position:fixed;inset:0;background:rgba(10,14,26,0.94);display:none;
    flex-direction:column;align-items:center;justify-content:center;z-index:30;
    padding:16px;padding-top:max(16px, env(safe-area-inset-top));
    padding-bottom:max(16px, env(safe-area-inset-bottom));}
  .lightbox.open{display:flex;}
  .lightbox img{max-width:100%;max-height:82vh;object-fit:contain;border-radius:8px;
    border:1px solid rgba(201,162,75,0.3);}
  .lightbox-credit{margin-top:10px;font-family:'JetBrains Mono',monospace;font-size:0.68rem;
    color:var(--ink-dim);text-align:center;max-width:640px;}
  .lightbox-step{position:absolute;top:50%;transform:translateY(-50%);
    width:64px;height:40%;min-height:90px;display:flex;align-items:center;
    justify-content:center;background:none;border:none;color:var(--cream);
    font-size:2.6rem;line-height:1;cursor:pointer;opacity:0.65;padding:0 0 6px;
    transition:opacity 0.15s ease;z-index:2;}
  .lightbox-step:hover{opacity:1;}
  .lightbox-step.prev{left:max(4px, env(safe-area-inset-left));}
  .lightbox-step.next{right:max(4px, env(safe-area-inset-right));}
  .lightbox-step[hidden]{display:none;}
  .lightbox-step:disabled{opacity:0.2;cursor:default;}
  .lightbox-count{margin-top:10px;font-family:'JetBrains Mono',monospace;
    font-size:0.66rem;color:var(--gold-dim);letter-spacing:0.05em;}
  .lightbox-close{position:absolute;top:max(10px, env(safe-area-inset-top));right:14px;
    background:transparent;border:1px solid var(--gold-dim);color:var(--gold);border-radius:6px;
    min-width:44px;min-height:44px;font-size:1.1rem;cursor:pointer;}

  .map-wrap{background:var(--navy-2);border:1px solid rgba(201,162,75,0.25);border-radius:12px;
    padding:14px;margin-bottom:14px;position:relative;
    /* Nothing in here paints outside the frame, so a redraw while dragging
       stays inside it instead of inviting the rest of the page along. */
    contain:paint;}
  #mapSvg{touch-action:none;}
  .map-zoom{position:absolute;top:20px;right:20px;display:flex;flex-direction:column;gap:5px;z-index:2;}
  .map-zoom button{width:34px;height:34px;border-radius:7px;background:rgba(19,29,52,0.82);
    border:1px solid rgba(156,166,192,0.35);color:var(--ink-dim);font-size:1rem;line-height:1;cursor:pointer;
    font-family:'JetBrains Mono',monospace;padding:0;}
  /* Utilities, not the move. On the map gold means your pin and the answer,
     so the zoom controls sit back until touched. */
  .map-zoom button:active{background:rgba(201,162,75,0.22);color:var(--gold);}
  @media (pointer: coarse){ .map-zoom button{width:40px;height:40px;} }
  #mapSvg{width:100%;height:auto;display:block;}
  /* scroll-margin keeps the panel clear of the bottom edge when a guess
     scrolls it into view, instead of landing flush against it. */
  .map-readout{margin-top:8px;font-size:0.82rem;color:var(--ink-dim);text-align:center;
    scroll-margin-bottom:26px;}
  .map-readout b{color:var(--cream);font-weight:500;}
  /* The verdict on the guess just made. It used to live only in the history
     list below the fold, so a player had to scroll to find out what their
     guess had done. */
  .map-readout.last-guess{display:flex;flex-direction:column;align-items:center;gap:6px;
    margin-top:10px;padding:9px 10px;background:var(--navy-2);
    border:1px solid var(--gold-dim);border-left:4px solid var(--lg-accent,var(--gold-dim));
    border-radius:8px;}
  .map-readout .lg-head{display:flex;align-items:center;gap:7px;font-size:0.88rem;color:var(--ink);}
  .map-readout .lg-head .hist-dot{flex:none;}
  /* Wrapped so the distance and its bearing stay on one line: in a column
     flex container a bare text node becomes a flex item of its own. */
  .map-readout .lg-dist{display:block;}
  /* The one line that answers "did I get it?" -- above the country and the
     distance, because that is the question a player asks first. */
  .map-readout .lg-verdict{font-family:'JetBrains Mono',monospace;font-size:0.74rem;
    letter-spacing:0.04em;text-transform:uppercase;}
  .map-readout .lg-verdict.no{color:var(--heat-close);}
  .map-readout .lg-verdict.ok{color:var(--correct);}
  .map-readout .lg-verdict b{color:inherit;font-weight:600;}
  /* Tries as boxes: a crossed one is spent. A count alone lived in the footer,
     far below the map, where nobody looked. */
  .map-readout .lg-tries{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    justify-content:center;font-family:'JetBrains Mono',monospace;font-size:0.66rem;
    color:var(--ink-dim);}
  .map-readout .lg-pips{display:flex;gap:4px;}
  .lg-pip{width:16px;height:16px;border-radius:4px;display:flex;align-items:center;
    justify-content:center;font-size:0.62rem;line-height:1;
    border:1px solid var(--gold-dim);color:var(--ink-dim);}
  .lg-pip.free{opacity:0.45;}
  .lg-pip.used{border-color:var(--heat-close);color:var(--heat-close);
    background:rgba(184,83,46,0.12);}
  .lg-pip.hit{border-color:var(--correct);color:var(--correct);
    background:rgba(92,138,92,0.16);}

  .guess-row{position:relative;margin-bottom:12px;}
  .tap-hint{text-align:center;font-size:0.8rem;color:var(--ink-dim);padding:6px 0;}
  /* A tap is cheap to make by accident and there are only three guesses a
     round, so a tap proposes and a second, deliberate press commits. */
  .pending{display:flex;align-items:center;gap:10px;background:var(--navy-2);
    border:1px solid var(--gold);border-radius:8px;padding:8px 8px 8px 14px;
    scroll-margin-bottom:26px;}
  /* An author display rule beats the UA stylesheet's [hidden], so the bar
     stayed on screen, empty, with the attribute set. */
  .pending[hidden]{display:none;}
  .pending-name{flex:1;font-size:0.95rem;color:var(--cream);font-weight:500;}
  .pending .btn{margin:0;flex:none;padding:10px 18px;}

  .clues{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:14px;}
  .clue{background:var(--navy-2);border:1px dashed rgba(201,162,75,0.25);border-radius:8px;padding:8px 9px;
    font-size:0.76rem;color:var(--ink-dim);min-height:38px;}
  .clue.full{grid-column:1 / -1;}
  .clue .label{display:block;font-family:'JetBrains Mono',monospace;font-size:0.6rem;color:var(--gold-dim);margin-bottom:2px;}
  .clue.locked{color:rgba(156,166,192,0.35);}
  .clue.unlocked{border-style:solid;color:var(--ink);}
  .clue.unlocked .label{color:var(--gold);}

  .history{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
  .hist-row{background:var(--navy-2);border-radius:8px;padding:8px 11px;display:flex;align-items:center;gap:8px;font-size:0.8rem;}
  .hist-dot{width:11px;height:11px;border-radius:50%;flex:none;}
  .hist-name{flex:1 1 auto;min-width:0;overflow-wrap:break-word;color:var(--cream);}
  .hist-km{font-family:'JetBrains Mono',monospace;font-size:0.73rem;color:var(--ink-dim);}
  .hist-row{flex-wrap:wrap;}
  /* Verdicts sit on their own line: at 320px they otherwise squeeze the
     country name down to a couple of characters per line. */
  .hist-tags{display:flex;gap:5px;flex:0 0 100%;margin-top:2px;padding-left:19px;}
  .hist-km{margin-left:auto;}
  .hist-tag{font-family:'JetBrains Mono',monospace;font-size:0.56rem;letter-spacing:0.02em;
    border-radius:4px;padding:2px 5px;border:1px solid transparent;white-space:nowrap;}
  .hist-tag.ok{background:rgba(92,138,92,0.22);border-color:var(--correct);color:#9ccf9c;}
  .hist-tag.no{background:rgba(156,166,192,0.10);border-color:rgba(156,166,192,0.3);color:var(--ink-dim);}

  .round-result, .final-result{background:var(--navy-2);border:1px solid var(--gold);border-radius:10px;
    padding:16px;text-align:center;margin-bottom:14px;}
  .round-result h2, .final-result h2{font-family:'Playfair Display',serif;color:var(--cream);margin:0 0 6px;font-size:1.2rem;}
  .round-result p, .final-result p{color:var(--ink-dim);font-size:0.83rem;margin:0 0 10px;}
  .tier-badge{display:inline-block;font-size:0.68rem;font-family:'JetBrains Mono',monospace;color:var(--gold);
    border:1px solid var(--gold-dim);border-radius:4px;padding:2px 7px;margin-bottom:8px;}
  .btn{background:var(--gold);color:var(--navy);border:none;border-radius:6px;padding:10px 18px;
    font-family:'Inter',sans-serif;font-weight:600;font-size:0.85rem;cursor:pointer;margin:3px;}
  .btn.secondary{background:transparent;color:var(--gold);border:1px solid var(--gold-dim);}
  /* The countdown's replacement when the day turns under an open tab. */
  .btn.small{padding:7px 13px;font-size:0.75rem;}
  /* The note for anyone who arrived inside another app's browser. Quiet, at
     the foot, dismissible: it is an explanation, not an obstacle. */
  .inapp-note{position:fixed;left:50%;transform:translateX(-50%);
    bottom:max(10px, env(safe-area-inset-bottom));z-index:40;
    width:min(420px, calc(100vw - 20px));display:flex;align-items:flex-start;gap:10px;
    padding:11px 12px;background:var(--navy-2);border:1px solid var(--gold-dim);
    border-radius:10px;box-shadow:0 12px 30px rgba(5,8,18,0.5);}
  .inapp-note[hidden]{display:none;}
  .inapp-note p{margin:0;flex:1;font-family:'JetBrains Mono',monospace;
    font-size:0.6rem;line-height:1.55;color:var(--ink-dim);}
  .inapp-note b{color:var(--cream);font-weight:500;}
  .inapp-note button{flex:none;background:none;border:none;color:var(--gold-dim);
    font-size:1.1rem;line-height:1;cursor:pointer;padding:0 2px;}
  .inapp-note button:hover{color:var(--gold);}
  /* ---------- The foot of the page ---------- */
  .site-foot{margin-top:26px;padding-top:14px;
    border-top:1px solid rgba(201,162,75,0.18);text-align:center;}
  .foot-links{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 2px;}
  .foot-links button, .foot-links a{background:none;border:none;cursor:pointer;
    font-family:'JetBrains Mono',monospace;font-size:0.63rem;letter-spacing:0.04em;
    color:var(--ink-dim);text-decoration:none;padding:6px 9px;border-radius:6px;}
  .foot-links button:hover, .foot-links a:hover{color:var(--gold);
    background:rgba(201,162,75,0.08);}
  .foot-credit{font-family:'JetBrains Mono',monospace;font-size:0.58rem;
    color:rgba(156,166,192,0.6);line-height:1.6;margin:6px 0 0;}
  .doc-head{font-family:'JetBrains Mono',monospace;font-size:0.66rem;
    letter-spacing:0.06em;text-transform:uppercase;color:var(--gold);
    margin:18px 0 6px;}
  .doc-head:first-child{margin-top:4px;}
  .doc-updated{font-family:'JetBrains Mono',monospace;font-size:0.58rem;
    color:var(--ink-dim);margin-top:18px;}
  /* Backup: a long code, so the box has to be a box rather than an input. */
  .backup{margin-top:16px;border-top:1px dashed rgba(201,162,75,0.22);padding-top:12px;}
  .backup summary{cursor:pointer;font-family:'JetBrains Mono',monospace;
    font-size:0.72rem;letter-spacing:0.04em;color:var(--gold);}
  .backup textarea{width:100%;box-sizing:border-box;margin-top:8px;padding:8px 9px;
    background:var(--navy-2);color:var(--ink-dim);border:1px solid var(--gold-dim);
    border-radius:7px;font-family:'JetBrains Mono',monospace;font-size:0.62rem;
    line-height:1.4;resize:vertical;}
  .backup-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 10px;}
  .backup-said{font-family:'JetBrains Mono',monospace;font-size:0.64rem;color:var(--gold-dim);}
  .share-grid{font-family:'JetBrains Mono',monospace;font-size:1rem;line-height:1.5;margin-bottom:10px;white-space:pre-line;}

  footer{text-align:center;font-family:'JetBrains Mono',monospace;font-size:0.72rem;color:var(--ink-dim);}

  /* ---- navigation between the day, the collection, the passport, the archive ---- */
  .nav{display:flex;gap:4px;justify-content:center;margin:12px 0 4px;flex-wrap:wrap;}
  .nav button{background:transparent;border:1px solid transparent;color:var(--ink-dim);
    font-family:'JetBrains Mono',monospace;font-size:0.66rem;letter-spacing:0.04em;
    text-transform:uppercase;padding:8px 10px;border-radius:6px;cursor:pointer;min-height:38px;}
  /* Marked by weight and an underline rather than a gold box. Where you are is
     orientation, not an action, and a second gold-bordered box beside the live
     round pip made the two compete for the same meaning. */
  .nav button.active{color:var(--cream);border-color:transparent;
    text-decoration:underline;text-underline-offset:5px;
    text-decoration-color:var(--gold-dim);}
  .view{display:none;} .view.active{display:block;}

  .panel-head{text-align:center;margin-bottom:14px;}
  .panel-head h2{font-family:'Playfair Display',serif;color:var(--cream);margin:0 0 4px;font-size:1.35rem;}
  .panel-head p{color:var(--ink-dim);font-size:0.8rem;margin:0;}

  /* ---- collection: catalogue cards with accession numbers ---- */
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:9px;}

  .card{background:var(--navy-2);border:1px solid rgba(201,162,75,0.22);border-radius:9px;overflow:hidden;}
  .card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--navy-3);}
  .card .card-body{padding:8px 9px 10px;}
  .card .acc{font-family:'JetBrains Mono',monospace;font-size:0.58rem;color:var(--gold-dim);
    letter-spacing:0.06em;display:block;margin-bottom:3px;}
  .card .card-name{color:var(--cream);font-size:0.82rem;line-height:1.25;margin-bottom:4px;}
  .card .card-meta{color:var(--ink-dim);font-size:0.68rem;}
  .card.missed{border-style:dashed;}
  /* The card is a button now, so it has to look touchable and say so. */
  .card{position:relative;cursor:pointer;text-align:left;}
  .card:hover .card-more, .card:focus-visible .card-more{color:var(--gold);}
  .card:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  .card .card-more{display:block;margin-top:6px;font-family:'JetBrains Mono',monospace;
    font-size:0.55rem;letter-spacing:0.04em;color:var(--ink-dim);text-transform:uppercase;}
  /* A star sits over the photograph rather than in the text: it belongs to the
     card as an object, and the gold says "kept" only when it is. */
  .card .fav{position:absolute;top:5px;right:5px;z-index:1;width:30px;height:30px;
    border-radius:50%;border:1px solid rgba(201,162,75,0.3);background:rgba(11,18,36,0.72);
    color:var(--ink-dim);font-size:0.95rem;line-height:1;padding:0;cursor:pointer;}
  .card .fav.on{color:var(--gold);border-color:var(--gold-dim);}
  .fav-hint{color:var(--ink-dim);font-size:0.72rem;text-align:center;margin-top:12px;}
  .modal-fav{display:block;margin:14px auto 0;}
  .modal-fav.on{color:var(--gold);border-color:var(--gold-dim);}
  /* Must follow the base .card rules above: same specificity, so source order
     decides. One column at phone width made every card a full-width tower, so
     the card becomes a row with the photo alongside the label. */
  @media (max-width:400px){
    .cards{grid-template-columns:1fr;}
    .card{display:flex;align-items:stretch;}
    .card img{width:38%;aspect-ratio:1/1;flex:none;}
    .card .card-body{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;}
  }

  /* ---- passport: one stamp per completed day ---- */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:16px;}
  .stat{background:var(--navy-2);border:1px solid rgba(201,162,75,0.2);border-radius:8px;
    padding:9px 5px;text-align:center;}
  .stat b{display:block;font-family:'Playfair Display',serif;color:var(--cream);font-size:1.25rem;}
  .stat span{font-family:'JetBrains Mono',monospace;font-size:0.55rem;color:var(--ink-dim);
    text-transform:uppercase;letter-spacing:0.05em;}
  .stamps-more{align-self:center;font-family:'JetBrains Mono',monospace;
    font-size:0.62rem;color:var(--ink-dim);padding:0 4px;}
  .stamps{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;}
  .stamp{width:52px;height:52px;border-radius:50%;display:flex;flex-direction:column;
    align-items:center;justify-content:center;border:2px dashed;transform:rotate(-6deg);
    font-family:'JetBrains Mono',monospace;}
  .stamp b{font-size:0.78rem;line-height:1;}
  .stamp span{font-size:0.48rem;opacity:0.8;}
  .stamp.s3{border-color:var(--correct);color:#9ccf9c;}
  .stamp.s2{border-color:var(--gold);color:var(--gold);}
  .stamp.s1{border-color:var(--heat-close);color:var(--heat-close);}

  /* ---- achievements ---- */
  /* Three to a row: a page of stamps, not a list of them. */
  .ach-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;}
  .ach-tile{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    gap:7px;min-height:104px;padding:12px 5px 11px;background:var(--navy-2);
    border:1px solid rgba(201,162,75,0.18);border-radius:9px;cursor:pointer;
    font:inherit;color:inherit;text-align:center;}
  .ach-tile span{font-size:0.62rem;line-height:1.25;color:var(--cream);}
  .ach-tile.locked{background:transparent;border-style:dashed;
    border-color:rgba(156,166,192,0.22);}
  .ach-tile.locked span{color:var(--ink-dim);}
  .ach-tile.on{border-color:var(--gold);background:rgba(201,162,75,0.08);}
  .ach-tile:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  /* ---------- Rank ----------
     Forty entries catalogued used to sit in the same frame as a month without
     missing a day. A common stamp keeps the plain frame; a rare one is drawn
     in gold; a prestige one gets a lit frame and a corner marker you can see
     from across the grid. A secret is not a rank -- it is a different kind of
     thing, and it looks like one: a wax seal. */
  .ach-tile.r-rare{border-color:rgba(201,162,75,0.5);}
  .ach-tile.r-prestige{border-color:var(--gold);
    background:linear-gradient(180deg, rgba(201,162,75,0.13), rgba(201,162,75,0.04));
    box-shadow:0 0 0 1px rgba(201,162,75,0.22), 0 4px 18px rgba(201,162,75,0.10);}
  /* A notch of gold in the corner: rank readable without reading anything. */
  .ach-tile.r-prestige::after{content:'';position:absolute;top:0;right:0;
    border-width:0 13px 13px 0;border-style:solid;
    border-color:transparent var(--gold) transparent transparent;
    border-radius:0 9px 0 0;}
  .ach-tile{position:relative;overflow:hidden;}
  .ach-tile.r-secret{border-color:var(--heat-close);
    background:linear-gradient(180deg, rgba(184,83,46,0.14), rgba(184,83,46,0.04));}
  .ach-tile.r-secret span{color:#E9C7B4;}
  /* The ring is drawn, not filled: filling it too painted the stamp into a
     solid disc with its own mark invisible inside it. */
  .ach-tile.r-secret .stamp-mark .ring{stroke:var(--heat-close);fill:none;}
  .ach-tile.r-secret .stamp-mark .stamp-text{fill:var(--heat-close);stroke:none;}
  /* Locked tiles say nothing about rank: that is half the point of a ladder. */
  .ach-tile.locked.r-rare, .ach-tile.locked.r-prestige, .ach-tile.locked.r-secret{
    border-color:rgba(156,166,192,0.22);background:transparent;box-shadow:none;}
  .ach-tile.locked.r-prestige::after{display:none;}
  .ach-when{font-family:'JetBrains Mono',monospace;font-size:0.53rem !important;
    color:var(--gold-dim) !important;letter-spacing:0.02em;}
  .ach-meta{display:block;margin-top:5px;font-family:'JetBrains Mono',monospace;
    font-size:0.56rem;color:var(--gold-dim);letter-spacing:0.05em;text-transform:uppercase;}
  .ach-detail.r-prestige{border-color:var(--gold);}
  .ach-detail.r-secret{border-color:var(--heat-close);}
  .toast-kind{display:block;font-family:'JetBrains Mono',monospace;font-size:0.55rem;
    letter-spacing:0.14em;text-transform:uppercase;color:var(--heat-close);
    margin-bottom:3px;}
  /* Spliced in at the end of the tapped tile's own row, so the description is
     never far from the stamp it belongs to. */
  .ach-detail{grid-column:1 / -1;display:flex;gap:12px;align-items:center;
    background:var(--navy-2);border:1px solid var(--gold-dim);border-radius:9px;
    padding:11px 13px;}
  .ach-detail b{display:block;color:var(--cream);font-size:0.85rem;margin-bottom:2px;}
  .ach-detail span{color:var(--ink-dim);font-size:0.72rem;line-height:1.4;}
  .ach-empty{color:var(--ink-dim);font-size:0.75rem;text-align:center;margin:14px 0 0;}

  /* A stamp, drawn rather than set in type. A glyph in a bordered circle sits
     wherever its font's metrics put it -- which is never quite the middle, and
     looks it. This is centred on the geometry, and an earned one is turned a
     few degrees the way a stamp actually lands on a page. */
  .stamp-mark{width:42px;height:42px;flex:none;overflow:visible;}
  .stamp-mark .ring{fill:none;stroke:var(--gold-dim);stroke-width:1.4;}
  .stamp-mark .ring.outer{stroke-dasharray:3 2.2;}
  .stamp-mark .stamp-text{fill:var(--gold-dim);text-anchor:middle;
    font-family:'JetBrains Mono',monospace;font-weight:700;letter-spacing:0.02em;}
  .stamp-mark.earned{transform:rotate(-7deg);}
  .stamp-mark.earned .ring{stroke:var(--gold);stroke-width:1.7;}
  .stamp-mark.earned .ring.inner{fill:rgba(201,162,75,0.1);}
  .stamp-mark.earned .stamp-text{fill:var(--gold);}

  /* Out of sight, one tap away: what is left to find is for whoever asks. */
  .ach-locked{margin-top:14px;}
  .ach-locked summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;
    font-family:'JetBrains Mono',monospace;font-size:0.65rem;letter-spacing:0.06em;
    text-transform:uppercase;color:var(--ink-dim);padding:10px 2px;min-height:40px;}
  .ach-locked summary::-webkit-details-marker{display:none;}
  .ach-locked summary::before{content:'\25B8';display:inline-block;color:var(--gold-dim);
    transition:transform 0.15s ease;}
  .ach-locked[open] summary::before{transform:rotate(90deg);}
  .ach-locked summary .count{border:1px solid rgba(156,166,192,0.3);border-radius:9px;
    padding:1px 7px;font-size:0.6rem;}

  /* ---- archive list ---- */
  .arch-list{display:flex;flex-direction:column;gap:6px;max-height:60vh;overflow-y:auto;}
  .arch-row{display:flex;align-items:center;gap:9px;background:var(--navy-2);border-radius:8px;
    padding:9px 11px;}
  .arch-day{font-family:'JetBrains Mono',monospace;font-size:0.72rem;color:var(--cream);flex:1;}
  .arch-score{font-family:'JetBrains Mono',monospace;font-size:0.68rem;color:var(--ink-dim);}
  /* A day nobody played has nothing to go back to, so it says so rather than
     offering a link that would open an unplayed puzzle. */
  /* Announces itself: earned in the middle of nothing in particular, so it
     should not have to be discovered in the passport later. */
  /* What arrives when something is won. Centred low on the screen, out of the
     way of the board, and drawn in the rank's own colours so the card looks
     like the thing it is announcing. */
  .award-card{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
    z-index:60;display:flex;flex-direction:column;align-items:center;gap:3px;
    min-width:230px;max-width:min(330px, calc(100vw - 32px));
    padding:14px 18px 15px;text-align:center;cursor:pointer;
    background:var(--navy-2);border:1px solid var(--gold);border-radius:12px;
    box-shadow:0 18px 44px rgba(5,8,18,0.6);
    animation:award-in 0.36s cubic-bezier(0.2,0.8,0.3,1);}
  @keyframes award-in{
    from{ opacity:0; transform:translate(-50%, 16px) scale(0.96); }
    to  { opacity:1; transform:translate(-50%, 0) scale(1); } }
  @media (prefers-reduced-motion: reduce){ .award-card{animation:none;} }
  .award-card.go{opacity:0;transition:opacity 0.4s ease;}
  .award-card .stamp-mark{width:52px;height:52px;margin:2px 0 4px;}
  .award-card b{font-family:'Playfair Display',serif;font-size:1.05rem;
    color:var(--cream);font-weight:600;}
  .award-card .award-desc{font-family:'Inter',sans-serif;font-size:0.72rem;
    color:var(--ink-dim);line-height:1.35;}
  .award-kind, .award-card .award-rank{font-family:'JetBrains Mono',monospace;
    font-size:0.55rem;letter-spacing:0.14em;text-transform:uppercase;
    color:var(--gold-dim);}
  .award-card .award-rank{margin-top:6px;}
  .award-card.r-prestige{border-color:var(--gold);
    box-shadow:0 0 0 1px rgba(201,162,75,0.3), 0 18px 44px rgba(5,8,18,0.6);}
  .award-card.r-prestige .award-kind{color:var(--gold);}
  .award-card.r-rare{border-color:rgba(201,162,75,0.55);}
  .award-card.r-secret{border-color:var(--heat-close);}
  .award-card.r-secret .award-kind{color:var(--heat-close);}
  .award-card.r-secret .stamp-mark .ring{stroke:var(--heat-close);fill:none;}
  .award-card.r-secret .stamp-mark .stamp-text{fill:var(--heat-close);stroke:none;}

  .dizzy-toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
    z-index:30;background:var(--navy-2);border:1px solid var(--gold);
    border-radius:10px;padding:11px 16px;text-align:center;
    box-shadow:0 14px 34px rgba(5,8,18,0.55);animation:toast-in 0.3s ease-out;}
  .dizzy-toast b{display:block;font-family:'Playfair Display',serif;
    color:var(--gold);font-size:0.95rem;}
  .dizzy-toast span{font-family:'JetBrains Mono',monospace;font-size:0.62rem;
    color:var(--ink-dim);}
  .dizzy-toast.go{opacity:0;transition:opacity 0.7s ease;}
  @keyframes toast-in{ from{ opacity:0; transform:translate(-50%,14px); }
                       to{ opacity:1; transform:translate(-50%,0); } }

  .arch-item{display:flex;flex-direction:column;}
  .arch-peek{background:none;border:1px solid var(--gold-dim);color:var(--gold-dim);
    border-radius:6px;padding:6px 9px;cursor:pointer;
    font-family:'JetBrains Mono',monospace;font-size:0.6rem;letter-spacing:0.04em;}
  .arch-peek:hover{color:var(--gold);border-color:var(--gold);}
  .arch-reveal{background:rgba(19,29,52,0.6);border:1px solid rgba(201,162,75,0.18);
    border-top:none;border-radius:0 0 8px 8px;padding:8px 9px 10px;margin-top:-4px;}
  .arch-note{font-family:'JetBrains Mono',monospace;font-size:0.58rem;
    color:var(--ink-dim);margin:2px 0 8px;line-height:1.4;}
  .arch-entry{display:flex;align-items:center;gap:9px;width:100%;text-align:left;
    background:none;border:none;padding:5px 4px;cursor:pointer;border-radius:7px;}
  .arch-entry:hover{background:rgba(201,162,75,0.08);}
  .arch-entry img, .arch-noimg{width:46px;height:34px;object-fit:cover;border-radius:5px;
    flex:none;background:var(--navy-2);border:1px solid rgba(201,162,75,0.2);}
  .arch-entry-text{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1;}
  .arch-entry-text b{color:var(--cream);font-size:0.76rem;font-weight:500;
    overflow-wrap:break-word;}
  .arch-entry-text span{font-family:'JetBrains Mono',monospace;font-size:0.6rem;
    color:var(--ink-dim);}
  .arch-have{font-family:'JetBrains Mono',monospace;font-size:0.55rem;color:var(--correct);
    border:1px solid var(--correct);border-radius:4px;padding:2px 5px;flex:none;}
  .arch-locked{font-family:'JetBrains Mono',monospace;font-size:0.6rem;
    color:rgba(156,166,192,0.5);letter-spacing:0.04em;text-transform:uppercase;
    padding:7px 2px;}

  .countdown{text-align:center;font-family:'JetBrains Mono',monospace;font-size:0.72rem;
    color:var(--ink-dim);margin-top:10px;}
  .countdown b{color:var(--gold);}
  .practice-banner{background:rgba(201,162,75,0.12);border:1px dashed var(--gold-dim);
    border-radius:8px;padding:7px 10px;text-align:center;color:var(--gold);
    font-family:'JetBrains Mono',monospace;font-size:0.62rem;margin-bottom:12px;letter-spacing:0.05em;}
  .cb-row{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;
    font-family:'JetBrains Mono',monospace;font-size:0.66rem;color:var(--ink-dim);}
  .cb-row input{width:17px;height:17px;accent-color:var(--gold);}
  /* Colour-blind mode: a glyph rides on every heat dot, so the reading never
     depends on hue alone. */
  .hist-dot{position:relative;}
  body.cb .hist-dot::after{content:attr(data-glyph);position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;font-size:0.5rem;color:var(--navy);}
  body.cb .share-grid{letter-spacing:0.05em;}

  /* Touch targets. Anything below 16px in an input makes iOS Safari zoom the
     page on focus and never zoom back, so the guess box goes to 16px exactly;
     controls go to the 44px minimum. Desktop keeps its original sizing. */
  @media (pointer: coarse), (max-width: 560px){
    /* Still a 44px target, but the padding is invisible: the control reads
       small while staying comfortably tappable. */
    .lang-btn{padding:12px 8px;min-height:44px;font-size:0.72rem;}
    .btn{min-height:44px;padding:12px 20px;}
    .modal-close{min-height:44px;}
  }
  .btn:active{filter:brightness(0.88);}
  .lang-btn:active{color:var(--gold);}

  .modal-backdrop{position:fixed;inset:0;background:rgba(10,14,26,0.75);display:none;align-items:center;justify-content:center;padding:20px;z-index:20;}
  .modal-backdrop.open{display:flex;}
  .modal{background:var(--navy-2);border:1px solid var(--gold);border-radius:12px;padding:22px;max-width:420px;width:100%;max-height:80vh;overflow-y:auto;}
  .modal h3{font-family:'Playfair Display',serif;color:var(--cream);margin:0 0 4px;font-size:1.25rem;}
  .modal .sub{color:var(--ink-dim);font-size:0.78rem;margin-bottom:14px;}
  .modal p{font-size:0.87rem;line-height:1.5;margin:0 0 10px;}
  .modal-section{border-top:1px dashed rgba(201,162,75,0.25);padding-top:10px;margin-top:10px;}
  .modal-section .label{font-family:'JetBrains Mono',monospace;font-size:0.65rem;color:var(--gold-dim);}
  .modal-close{display:block;margin:16px auto 0;}

  /* ---- the entry panel: the photographs first, then where to go next ----
     A card in the collection is a thing you met once; opening it should feel
     like opening a drawer of the plates, not like reading a caption. */
  .entry-modal{padding:0 0 18px;}
  .entry-modal > :not(.gal):not(.gal-credit){margin-left:20px;margin-right:20px;}
  .gal{position:relative;margin:0;background:var(--navy-3);border-radius:11px 11px 0 0;
    overflow:hidden;aspect-ratio:4/3;}
  .gal img{width:100%;height:100%;object-fit:cover;display:block;}
  .gal-arrow{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;
    border-radius:50%;border:1px solid rgba(201,162,75,0.3);background:rgba(11,18,36,0.72);
    color:var(--cream);font-size:1.2rem;line-height:1;padding:0;cursor:pointer;}
  .gal-arrow.prev{left:8px;} .gal-arrow.next{right:8px;}
  .gal-arrow[disabled]{opacity:0.28;cursor:default;}
  .gal-dots{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;
    gap:5px;}
  .gal-dots i{width:6px;height:6px;border-radius:50%;background:rgba(240,236,225,0.35);
    display:block;}
  .gal-dots i.on{background:var(--gold);}
  /* Attribution belongs with the photograph, and by this point the round is
     over -- this panel only ever opens on an entry already revealed. */
  .gal-credit{font-family:'JetBrains Mono',monospace;font-size:0.56rem;color:var(--ink-dim);
    line-height:1.45;padding:7px 20px 0;word-break:break-word;}
  .entry-modal h3{margin-top:12px;}
  .modal-actions{display:flex;gap:8px;margin-top:16px;}
  .modal-actions .btn{flex:1;margin:0;min-height:44px;}
  .modal-actions .modal-fav[hidden]{display:none;}
</style>
</head>
<body>
<div class="page">
  <header>
    <!-- The mark is a button because it does something: it spins. If the file
         is missing or misnamed the image hides itself, so the header falls back
         to the wordmark alone rather than showing a broken-image icon. See
         assets/README.md -- capitalisation is part of the filename on Pages. -->
    <button class="mark" id="mark" aria-label="Heritle" aria-expanded="false"
            aria-controls="markMenu">
      <img src="assets/vectorised-4c7d2e03.svg" alt=""
           onerror="this.closest('.mark').hidden = true">
    </button>
    <!-- Where the links live. The foot of the page was the wrong home for
         them: nobody scrolls past the puzzle to find out what the game is. -->
    <div class="mark-menu" id="markMenu" hidden></div>
    <!-- The way back. Searching Google to get to Google: after four links
         deep into a heritage register, the name at the top is what a hand
         reaches for. An anchor rather than a click handler, so it can be
         middle-clicked, opened in a tab, and read as a link. -->
    <a class="wordmark" href="." aria-label="Heritle">Heritle</a>
    <div class="pitch" id="pitch"></div>
    <div class="tagline" id="tagline"></div>
    <div class="lang-slider" role="tablist">
      <button class="lang-btn active" data-lang="en">EN</button>
      <button class="lang-btn" data-lang="fr">FR</button>
      <button class="lang-btn" data-lang="es">ES</button>
      <a class="lang-ig" id="langIg" target="_blank" rel="noopener noreferrer">
        <img src="assets/Instagram_white.svg" alt="" aria-hidden="true">
      </a>
    </div>
  </header>

  <div class="nav" id="nav"></div>

  <div class="view active" id="viewGame">
    <div class="rounds-row" id="roundsRow"></div>

    <div class="meta-row">
      <span class="mode-badge" id="modeBadge"></span>
      <span class="score-badge" id="scoreBadge"></span>
    </div>

    <div class="photo-box" id="photoBox">
      <img id="siteImg" alt="">
      <div class="photo-fallback" id="photoFallback">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M3 20h18M5 20V9l7-5 7 5v11M9 20v-6h6v6"/></svg>
        <span id="fallbackText"></span>
      </div>
      <span class="photo-credit" id="photoCredit"></span>
      <!-- The counter stays in the corner; the arrows are their own targets
           down each side, because they sat inside a picture that opens a
           lightbox when tapped and every near miss opened it. -->
      <div class="photo-nav" id="photoNav" hidden>
        <span class="photo-count" id="photoCount"></span>
      </div>
      <button class="photo-step prev" id="photoPrev" hidden
              aria-label="Previous photograph">‹</button>
      <button class="photo-step next" id="photoNext" hidden
              aria-label="Next photograph">›</button>
      <span class="zoom-hint"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4M11 8v6M8 11h6"/></svg></span>
    </div>

    <div class="map-wrap">
      <svg id="mapSvg" viewBox="0 0 440 220"></svg>
      <div class="map-zoom">
        <button id="zoomIn" aria-label="Zoom in">+</button>
        <button id="zoomOut" aria-label="Zoom out">−</button>
        <button id="zoomReset" aria-label="Reset view">⤢</button>
      </div>
      <div class="map-readout" id="mapReadout"></div>
    </div>

    <div class="guess-row" id="guessRow">
      <div class="tap-hint" id="tapHint"></div>
      <div class="pending" id="pendingGuess" hidden>
        <span class="pending-name" id="pendingName"></span>
        <button class="btn" id="confirmGuess"></button>
      </div>
    </div>

    <div class="clues" id="clues"></div>
    <div class="history" id="history"></div>
    <div class="round-result" id="roundResult" hidden></div>
    <div class="final-result" id="finalResult" hidden></div>


    <footer id="guessCounter"></footer>
    <div class="countdown" id="countdown"></div>
  </div>

  <div class="view" id="viewCollection"></div>
  <div class="view" id="viewPassport"></div>
  <div class="view" id="viewArchive"></div>

  <!-- Outside the views, because terms and privacy are not part of today's
       puzzle: inside the game view they showed on Today alone, and on a wide
       screen they were auto-placed into the board's own grid, sitting in a
       column beside the guess counter. -->
  <footer class="site-foot" id="siteFoot"></footer>
</div>

<!-- Dims the page behind the open menu. Outside .page so it covers
     everything, and beneath the menu so the menu stays lit. -->
<div class="mark-dim" id="markDim" hidden></div>
<div class="inapp-note" id="inappNote" hidden></div>

<div class="modal-backdrop" id="aboutBackdrop">
  <div class="modal">
    <h3 id="aboutTitle"></h3>
    <div id="aboutBody"></div>
    <button class="btn secondary modal-close" id="aboutClose"></button>
  </div>
</div>

    <button class="btn modal-close" id="fnClose"></button>
  </div>
</div>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose" aria-label="Close">&times;</button>
  <!-- Zoomed in is where the detail is, so it is also where a player wants to
       compare one photograph against the next. -->
  <button class="lightbox-step prev" id="lightboxPrev" aria-label="Previous photograph">‹</button>
  <button class="lightbox-step next" id="lightboxNext" aria-label="Next photograph">›</button>
  <img id="lightboxImg" alt="">

      <button class="btn secondary modal-fav" id="modalFav" hidden></button>
      <button class="btn secondary modal-close" id="modalClose"></button>
    </div>
  </div>
</div>

         body:[
           'I am Paul. I study heritage and museums, cultural heritage management, and I built Heritle on my own, out of an observation: the World Heritage lists are among the most remarkable inventories humanity has ever assembled, hardly anyone really knows them, and global trends aren’t always going in the direction of opening and sharing our natural and cultural wealth.',
           'So this daily game aims to increase attention and visibility. Three inscribed sites and one living tradition, each shown as a photograph with the name taken away, and you place them on a map. Working out where something is forces you to actually look at it: the architecture, the vegetation, the people, which is far more attention than a list usually ever gets.',
           'Inscription brings protection, funding and expertise, and it brings crowds, speculation and pressure along with them: a place can be loved into difficulty. What helps over time is a public that knows what it has. People defend what they can name, and money follows attention. That is truer still of intangible heritage, where a craft, a song, a festival survives by being practised and known, and a tradition nobody has heard of is one bad decade from disappearing.',

           'Je m’appelle Paul. J’étudie le patrimoine et les musées, la gestion du patrimoine culturel, et j’ai construit Heritle seul, à partir d’un constat : les listes du patrimoine mondial comptent parmi les inventaires les plus remarquables que l’humanité ait jamais établis, presque personne ne les connaît vraiment, et les tendances mondiales ne vont pas toujours dans le sens de l’ouverture et du partage de nos richesses naturelles et culturelles.',
           'Ce jeu quotidien vise donc à accroître l’attention et la visibilité. Trois sites inscrits et une tradition vivante, montrés en photographie et privés de leur nom, à situer sur une carte. Chercher où se trouve une chose oblige à la regarder vraiment : l’architecture, la végétation, les gens, soit bien plus d’attention qu’une liste n’en reçoit d’ordinaire.',
           'L’inscription apporte protection, financements et expertise ; elle apporte aussi la foule, la spéculation et la pression : un lieu peut être aimé jusqu’à l’étouffement. Ce qui aide dans la durée, c’est un public qui sait ce qu’il possède. On défend ce que l’on sait nommer, et les moyens suivent l’attention. C’est plus vrai encore du patrimoine immatériel, où un savoir-faire, un chant, une fête ne survivent qu’en étant pratiqués et connus, et où une tradition dont personne n’a entendu parler est à une mauvaise décennie de disparaître.',
           'Heritle est indépendant et gratuit, sans compte ni publicité, et n’est affilié à aucune organisation patrimoniale. Le jeu lit des données publiques et vous demande de regarder de près des lieux qui méritent d’être connus.'
         ] },

       faq:{ title:'Questions',
         sections:[
           ['Qu’est-ce que c’est ?',
            'Un jeu quotidien sur les listes du patrimoine mondial. Trois sites inscrits et une tradition vivante, montrés en photographie et privés de leur nom ; à vous de les situer sur une carte. Tout le monde reçoit les quatre mêmes, et ils changent à votre minuit local.'],
           ['Est-ce officiel ?',
            'Non. Heritle est fait par une seule personne et n’est ni affilié à l’UNESCO ni à aucune autre organisation patrimoniale, ni approuvé par elles. Le jeu lit des données publiques sur les listes ; il ne parle au nom de personne.'],
           ['D’où viennent les photographies et les données ?',
            'Les entrées viennent de Wikidata, qui publie les listes en données ouvertes. Les photographies viennent de Wikimedia Commons et sont créditées — photographe et licence — une fois la manche terminée : elles sont retenues pendant, parce qu’un modèle de licence nomme souvent le pays et donne la réponse. Les contours des pays viennent de Natural Earth, dans le domaine public.'],
           ['Comment le score est-il calculé ?',
            'Chaque site vaut un tiers de 100 et la tradition bonus vaut 50 : la journée est sur 150. Trouver le pays vaut le plus au premier essai, un peu moins à chacun des suivants. À défaut, votre proposition la plus proche compte quand même, selon la distance et selon que la région ou le continent étaient les bons — pour une tradition partagée par toute une région, c’est la bonne partie du monde qui est le vrai signal.'],
           ['Pourquoi ne puis-je pas jouer une journée manquée ?',
            'Parce que le jeu deviendrait un catalogue à rattraper plutôt qu’un rendez-vous quotidien, et qu’on pourrait l’enchaîner depuis le premier jour. Les journées terminées se rejouent à l’entraînement, et n’importe quelle journée passée peut être consultée dans les Archives pour voir ce qu’elle contenait — regarder n’ajoute rien à votre collection.'],
           ['Vais-je perdre ma collection ?',
            'Elle vit dans ce navigateur et nulle part ailleurs : il n’y a pas de compte, donc rien sur un serveur pour la restaurer. Effacer les données du site, changer d’appareil, ou laisser passer quinze jours sur certains navigateurs la fait disparaître. Le Passeport contient un code de sauvegarde prévu pour cela : copiez-le en lieu sûr et collez-le sur le nouvel appareil.'],
           ['Y a-t-il une application ?',
            'Non, et ce n’est pas nécessaire. C’est une seule page : ajoutez-la à votre écran d’accueil et elle se comportera à peu près comme une application.'],
           ['Puis-je proposer quelque chose, ou signaler un problème ?',
            'Volontiers — l’adresse est en bas de page, et le code source est public.']
         ] },

       about:{ label:'Quién soy', title:'Quién soy',
         body:[
           'Me llamo Paul. Estudio patrimonio y museos, gestión del patrimonio cultural, y construí Heritle por mi cuenta a partir de una constatación: las listas del patrimonio mundial están entre los inventarios más notables que la humanidad ha reunido jamás, casi nadie las conoce de verdad, y las tendencias mundiales no siempre van en la dirección de abrir y compartir nuestra riqueza natural y cultural.',
           'Así que este juego diario busca aumentar la atención y la visibilidad. Tres sitios inscritos y una tradición viva, mostrados como fotografía y sin su nombre, para situarlos en un mapa. Averiguar dónde está algo obliga a mirarlo de verdad: la arquitectura, la vegetación, la gente, mucha más atención de la que suele recibir una lista.',
           'La inscripción trae protección, financiación y experiencia, y trae consigo multitudes, especulación y presión: un lugar puede ser querido hasta la asfixia. Lo que ayuda con el tiempo es un público que sepa lo que tiene. Se defiende lo que se sabe nombrar, y los recursos siguen a la atención. Y más aún en el patrimonio inmaterial, donde un oficio, un canto, una fiesta sobreviven al practicarse y al conocerse, y donde una tradición de la que nadie ha oído hablar está a una mala década de desaparecer.',
           'Heritle es independiente y gratuito, sin cuenta ni publicidad, y no está afiliado a ninguna organización del patrimonio. Lee datos públicos y te pide mirar de cerca lugares que vale la pena conocer.'
         ] },

       faq:{ title:'Preguntas',
         sections:[
           ['¿Qué es esto?',
            'Un juego diario sobre las listas del patrimonio mundial. Tres sitios inscritos y una tradición viva, mostrados como fotografía y sin su nombre; tú los sitúas en un mapa. Todo el mundo recibe los mismos cuatro, y cambian a tu medianoche local.'],
           ['¿Es oficial?',
            'No. Heritle lo hace una sola persona y no está afiliado a la UNESCO ni a ninguna otra organización del patrimonio, ni cuenta con su respaldo. Lee datos públicos sobre las listas; no habla en nombre de nadie.'],
           ['¿De dónde salen las fotografías y los datos?',
            'Las entradas vienen de Wikidata, que publica las listas como datos abiertos. Las fotografías vienen de Wikimedia Commons y se acreditan —fotógrafo y licencia— cuando termina la ronda: se retienen durante ella porque una plantilla de licencia suele nombrar el país y regalar la respuesta. Los contornos de los países vienen de Natural Earth, de dominio público.'],
           ['¿Cómo se calcula la puntuación?',
            'Cada sitio vale un tercio de 100 y la tradición bonus vale 50: la jornada es sobre 150. Acertar el país vale más al primer intento y algo menos en cada uno siguiente. Si no, tu propuesta más cercana puntúa igualmente, según lo cerca que quedara y según si la región o el continente eran los correctos: para una tradición compartida por toda una región, la parte del mundo correcta es la señal que importa.'],
           ['¿Por qué no puedo jugar un día que me perdí?',
            'Porque entonces el juego sería un catálogo por recuperar en lugar de una cita diaria, y podría devorarse desde el primer día. Las jornadas terminadas se pueden repetir como práctica, y cualquier día pasado se puede consultar en el Archivo para ver qué contenía: mirar no añade nada a tu colección.'],
           ['¿Voy a perder mi colección?',
            'Vive en este navegador y en ningún otro sitio: no hay cuenta, así que no hay nada en un servidor desde donde restaurarla. Borrar los datos del sitio, cambiar de dispositivo o pasar un par de semanas sin entrar en algunos navegadores la hace desaparecer. El Pasaporte incluye un código de copia de seguridad precisamente para esto: guárdalo en un lugar seguro y pégalo en el dispositivo nuevo.'],
           ['¿Hay aplicación?',
            'No, y no hace falta. Es una sola página: añádela a tu pantalla de inicio y se comportará prácticamente como una aplicación.'],
           ['¿Puedo sugerir algo o avisar de un fallo?',
            'Por favor: la dirección está al pie de la página, y el código es público.']
         ] },
       privacy:{ title:'Privacidad',

           ['En resumen',

           ['Qué se guarda, y dónde',

           ['Con quién más habla tu navegador',

           ['Sin perfilado, y nada que solicitar',
